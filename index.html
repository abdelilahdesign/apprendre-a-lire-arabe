*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 120px}
.hidden{display:none!important}

/* ---------- Arabe : calques superposés (couleur des harakat sans casser la liaison) ---------- */
.ar{position:relative;display:inline-block;font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;white-space:nowrap;line-height:1.9;font-weight:400;vertical-align:middle}
.ar>.lay{position:absolute;inset:0;pointer-events:none;white-space:nowrap}
.ar>.lay-a{color:var(--ha)}
.ar>.lay-i{color:var(--hi)}
.ar>.lay-u{color:var(--hu)}
.ar>.lay-top{position:relative}
.ar .hl{color:var(--accent)}
.ar>.lay .hl{color:inherit}
.ar .bad{color:var(--accent)}
.ar>.lay .bad{color:inherit}

/* ---------- Typo ---------- */
.lbl{font-family:var(--f-lbl);color:var(--ink2);font-size:14px;margin:0}
.page-title{font-family:var(--f-sans);font-weight:300;text-transform:uppercase;letter-spacing:.16em;font-size:19px;margin:6px 0 4px}
.rule{height:1px;background:var(--line);margin:10px 0 18px;border:0}
.muted{color:var(--ink2)}
.small{font-size:14px}

/* ---------- Accueil ---------- */
.hero{padding:18px 0 8px}
.hero-title{font-family:var(--f-round);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.02;margin:6px 0 14px;letter-spacing:-.005em}
.hello{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:18px}
.hello strong{font-weight:600}
.link{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:36px}
.prog{margin:18px 0 14px}
.bar{height:6px;border-radius:6px;background:var(--card);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .5s}
.prog p{margin:8px 0 0;font-size:14px;color:var(--ink2)}

.session{margin:38px 0 10px}
.s-head{display:flex;align-items:flex-end;gap:12px}
.s-num{font-family:var(--f-display);font-size:68px;line-height:.9;font-weight:400}
.s-lbl{font-family:var(--f-lbl);font-size:16px;color:var(--ink2);padding-bottom:6px}
.s-glyphs{margin-left:auto;font-family:var(--f-ar);font-size:22px;color:var(--ink2);direction:rtl;padding-bottom:2px}
.s-meta{font-size:13px;color:var(--ink2);margin:-8px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.lcard{position:relative;background:var(--card);border-radius:var(--r);padding:12px 6px 12px;min-height:134px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.lcard:active{transform:scale(.97)}
.lcard .ar{font-size:50px;line-height:1.55}
.lcard-name{font-family:var(--f-lbl);font-size:15px;margin-top:2px}
.lcard-hint{font-size:11.5px;color:var(--ink2);line-height:1.25;margin-top:2px;padding:0 4px}
.lcard.notion{background:transparent;border:1px solid var(--line);box-shadow:none}
.lcard .done{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.s-actions{margin-top:14px}
.foot{margin:48px 0 10px;text-align:center}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:14px;padding:0 20px;font-weight:500;font-size:16px;transition:background .2s,transform .12s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--card)}
.btn.ghost{border:1px solid var(--line)}
.btn.block{display:flex;width:100%}
.btn.wa{background:#25D366;color:#10301c}
.btn:disabled{opacity:.45}
.btn-audio{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:15px}
.btn-audio svg{width:18px;height:18px}
.btn-audio.big{min-height:64px;padding:0 28px;font-size:18px;background:var(--ink);color:var(--bg);border:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- Navigation ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(242,238,235,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20}
.nav button{flex:0 1 200px;min-height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);gap:2px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink);background:var(--card)}

/* ---------- Série ---------- */
.s-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.s-top .x{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);flex:none}
.s-top .x svg{width:18px;height:18px}
.s-top .bar{flex:1}
.s-count{font-size:13px;color:var(--ink2);min-width:42px;text-align:right}
.step-lbl{font-family:var(--f-lbl);color:var(--ink2);font-size:15px;margin:14px 0 2px}
.step-title{font-family:var(--f-sans);font-weight:300;text-transform:uppercase;letter-spacing:.14em;font-size:17px;margin:0 0 4px}
.prompt{font-size:19px;margin:12px 0 14px;line-height:1.4}
.prompt b{font-weight:600}
.center{text-align:center}

.onl{display:inline-block;border-bottom:3px solid var(--accent);padding:0 .35em;line-height:1.35}
.big .ar{font-size:clamp(84px,30vw,128px);line-height:1.6}
.word .ar{font-size:clamp(46px,15vw,72px);line-height:1.9}

.flip{perspective:1200px;height:min(56vh,390px);margin:10px 0 14px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r-lg);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;box-shadow:var(--shadow);text-align:center;overflow:hidden}
.face.back{transform:rotateY(180deg);background:var(--paper);border:1px solid var(--line)}
.face .tag{position:absolute;top:16px;left:18px;font-family:var(--f-lbl);font-size:13px;color:var(--ink2)}
.face .tag-r{position:absolute;top:14px;right:16px}
.face .hint{position:absolute;bottom:16px;font-size:13px;color:var(--ink2)}
.phon{font-family:var(--f-sans);font-size:clamp(30px,9vw,44px);font-weight:300;letter-spacing:.02em;margin:4px 0 6px}
.sens{font-family:var(--f-lbl);color:var(--ink2);margin:0 0 16px;font-size:16px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:3px 10px;background:var(--card);color:var(--ink)}
.badge.inv{background:#F4E3C9}
.badge.warn{background:var(--badbg);color:#8a1a12}
.badge.ok{background:var(--okbg);color:#20492c}
.selfeval{display:grid;grid-template-columns:1fr 1fr;gap:10px;visibility:hidden;opacity:0;transition:opacity .3s}
.selfeval.on{visibility:visible;opacity:1}

.forms3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.fcard{background:var(--card);border-radius:var(--r);padding:10px 4px 6px;text-align:center}
.fcard .ar{font-size:44px;line-height:1.7;color:var(--ink)}
.fcard .ar .hl{color:var(--accent)}
.note{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:15px;margin:12px 0}
.examples{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.ex{background:var(--card);border-radius:var(--r);padding:6px 16px;text-align:center;min-width:92px}
.ex .ar{font-size:40px}
.ex small{display:block;color:var(--ink2);font-size:13px;margin-top:-4px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin:10px 0}
.opt{background:var(--card);border-radius:var(--r);min-height:96px;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:var(--shadow);transition:background .2s,transform .12s;border:2px solid transparent}
.opt:active{transform:scale(.97)}
.opt .ar{font-size:48px}
.opt.txt{font-size:17px;min-height:64px}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--accent)}
.opt:disabled{cursor:default}
.display{text-align:center;margin:6px 0 12px}

/* ---------- Tuiles ---------- */
.ans{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-height:104px;display:flex;align-items:center;justify-content:center;padding:4px 14px;margin:8px 0 12px;overflow-x:auto}
.ans .ar{font-size:clamp(46px,14vw,64px)}
.ans .ph{color:var(--ink2);font-size:15px}
.kb{background:var(--card);border-radius:var(--r);padding:10px}
.kb-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;direction:rtl}
.kb-row+.kb-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.tile{height:52px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(74,52,38,.12)}
.tile .ar{font-size:28px;line-height:1.9}
.tile.sign{background:var(--bg)}
.tile.sign .ar{font-size:32px}
.tile:active{transform:scale(.94);background:#fff}
.kb-ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.kb-ctrl button{min-height:46px;border-radius:10px;background:var(--bg);font-size:13.5px;line-height:1.2;padding:4px}

/* ---------- Correction / remédiation ---------- */
.fb-ok{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--okbg);color:#20492c;border-radius:var(--r);padding:14px;margin:14px 0;font-weight:500}
.remed{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0}
.remed h3{font-family:var(--f-lbl);font-weight:400;font-size:18px;margin:0 0 12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--card);border-radius:var(--r-sm);padding:8px;text-align:center;min-width:0}
.cmp>div.good{background:var(--okbg)}
.cmp .ar{font-size:clamp(30px,10vw,44px)}
.cmp .txtans{font-size:17px;padding:12px 0}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:4px;direction:rtl}
.strip .cl{background:var(--paper);border-radius:8px;padding:0 6px;min-width:30px;border:1px solid transparent}
.strip .cl .ar{font-size:26px;line-height:1.8}
.strip .cl.bad{background:#FBD0C9;border-color:var(--accent)}
.strip .sp{width:10px}
.msgs{margin:14px 0 10px;padding:0;list-style:none}
.msgs li{padding:6px 0 6px 18px;position:relative;font-size:16.5px}
.msgs li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.msgs .ar{font-size:26px;line-height:1.3}
.remed-actions{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.remed-actions .btn{min-height:46px;font-size:15px;padding:0 14px}

.mini-intro{background:var(--card);border-radius:var(--r-lg);padding:24px;text-align:center;margin:20px 0}
.result{text-align:center;padding:10px 0}
.score{font-family:var(--f-display);font-size:92px;line-height:1;margin:12px 0 0}
.score small{font-size:40px;color:var(--ink2)}
.result ul{list-style:none;padding:0;margin:8px 0}
.result li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 16px}
.chip{background:var(--card);border-radius:999px;padding:2px 14px;font-size:15px}
.chip .ar{font-size:24px;line-height:1.7}

/* ---------- Dictées ---------- */
.dlist{display:flex;flex-direction:column;gap:10px}
.ditem{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:var(--r);padding:14px 16px;min-height:64px;text-align:left;width:100%}
.ditem b{font-weight:500}
.empty{font-size:14px;color:var(--ink2);padding:6px 0}

/* ---------- Modale & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(74,52,38,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(74,52,38,.2);animation:up .28s cubic-bezier(.2,.75,.2,1)}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:24px}}
.modal h2{font-family:var(--f-sans);font-weight:300;text-transform:uppercase;letter-spacing:.14em;font-size:17px;margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-family:var(--f-lbl);color:var(--ink2);font-size:14px}
.field input,.field select,.field textarea{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:10px 14px;font-size:17px;width:100%}
.field input.arin{font-family:var(--f-ar);font-size:30px;direction:rtl;text-align:right;min-height:64px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;z-index:60;max-width:88vw;text-align:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- Admin ---------- */
.adm details{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden}
.adm summary{list-style:none;padding:16px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:56px}
.adm summary::-webkit-details-marker{display:none}
.adm summary::after{content:"+";font-size:22px;color:var(--ink2);font-weight:300}
.adm details[open] summary::after{content:"–"}
.adm .inner{padding:0 16px 16px}
.adm-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm-filters select{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:15px}
.ilist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:6px 10px}
.irow .ar{font-size:30px;line-height:1.7}
.irow .meta{font-size:13px;line-height:1.35;min-width:0;overflow:hidden}
.irow .meta b{font-weight:500;font-size:14.5px}
.irow .acts{display:flex;gap:4px}
.irow .acts button{width:40px;height:40px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.irow .acts svg{width:16px;height:16px}
.irow.issue{outline:2px solid var(--accent)}
.report{font-size:14px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;max-height:260px;overflow:auto;white-space:pre-wrap}
.warnbox{background:var(--badbg);color:#6e1710;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.okbox{background:var(--okbg);color:#20492c;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.preview{text-align:center;background:var(--card);border-radius:12px;min-height:70px;display:flex;align-items:center;justify-content:center}
.preview .ar{font-size:42px}
.rec-on{background:var(--accent)!important;color:#fff!important}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

<main id="main" class="wrap"></main>
<nav id="nav" class="nav" aria-label="Navigation">

  <button data-act="tab" data-tab="dictees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>Dictées</button>
</nav>
<script id="app-data" type="application/json">null</script>
<script id="app-audio" type="application/json">{}</script>
<script>
'use strict';
/* Copie du fichier d'origine (avant tout affichage) : sert au bouton « Télécharger le HTML mis à jour ». */
const SOURCE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

/* =====================================================================
   1. OUTILS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const pad = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('fr-FR');
const uniq = a => [...new Set(a)];
let _uid = Date.now() % 100000;
const uid = () => 'i' + (++_uid).toString(36) + Math.random().toString(36).slice(2, 5);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Enregistrement impossible sur cet appareil (mémoire pleine ?)'); return false; } }

const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="8" height="11" rx="2"/><rect x="13" y="9" width="8" height="11" rx="2"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" width="22" height="22"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* =====================================================================
   2. ALPHABET, SIGNES ET ORDRE DES LEÇONS
   ===================================================================== */
const F = '\u064E', K = '\u0650', D = '\u064F', FT = '\u064B', KT = '\u064D', DT = '\u064C', SH = '\u0651', SK = '\u0652', TW = '\u0640', ZWJ = '\u200D';
const VOWELS = [F, K, D, FT, KT, DT];
const HNAME = { [F]: 'fatha', [K]: 'kasra', [D]: 'damma', [FT]: 'fathatayn', [KT]: 'kasratayn', [DT]: 'dammatayn', [SH]: 'chedda', [SK]: 'soukoun' };
const NAME2MARK = Object.fromEntries(Object.entries(HNAME).map(([m, n]) => [n, m]));
const VSOUND = { [F]: 'a', [K]: 'i', [D]: 'ou', [FT]: 'an', [KT]: 'in', [DT]: 'oun' };
const FAM = { a: [F, FT], i: [K, KT], u: [D, DT] };

/* =====================================================================
   3. DÉCOUPAGE, TRANSCRIPTION, CHRONOLOGIE
   ===================================================================== */
function clusters(str, keepTw) {
  str = String(str || '').normalize('NFC').replace(/[\u200C\u200D]/g, '');
  if (!keepTw) str = str.replace(/\u0640/g, '');
  const out = [];
  for (const ch of str) {
    if (isMark(ch)) { if (!out.length) out.push({ b: '', m: [] }); out[out.length - 1].m.push(ch); }
    else out.push({ b: ch, m: [] });
  }
  out.forEach(c => c.m.sort((x, y) => (x === SH ? -1 : y === SH ? 1 : 0)));
  return out;
}
const cstr = c => c.b + c.m.join('');
const canon = s => clusters(s).map(cstr).join('');
const vowelOf = c => c.m.find(m => VOWELS.includes(m));
const letterCount = s => clusters(s).filter(c => c.b && c.b !== ' ').length;

function sameWord(g, e, ignoreMarks) {
  const G = clusters(g).filter(c => c.b || c.m.length), E = clusters(e).filter(c => c.b || c.m.length);
  if (G.length !== E.length) return false;
  return G.every((c, i) => c.b === E[i].b && (ignoreMarks || c.m.slice().sort().join('') === E[i].m.slice().sort().join('')));
}

/* Transcription phonétique « du cours » : aa / ii / ouu pour les prolongations, an / in / oun pour le tanwin */
function translit(str) {
  const cl = clusters(str); let out = '', pv = '', noDouble = -1;
  for (let i = 0; i < cl.length; i++) {
    const c = cl[i], b = c.b, v = vowelOf(c);
    if (b === ' ') { out += ' '; pv = ''; continue; }
    if (b === '') continue;
    if (i === 0 && b === 'ا' && cl[1] && cl[1].b === 'ل' && cl.length > 2) {
      const n = cl[2];
      if (!cl[1].m.length && n.m.includes(SH)) { out += 'a' + (TR[n.b] || '') + '-'; noDouble = 2; }
      else out += 'al-';
      i = 1; pv = ''; continue;
    }
    if (!c.m.length) {
      if (b === 'ا') { out += pv === 'an' ? '' : 'a'; pv = ''; continue; }
      if (b === 'و' && pv === 'ou') { out += 'u'; pv = ''; continue; }
      if (b === 'ي' && pv === 'i') { out += 'i'; pv = ''; continue; }
      if (b === 'ة') { out += 'a(h)'; pv = ''; continue; }
    }
    let cons = TR[b] ?? '';
    if (HAMZAS.includes(b)) cons = (out === '' || /[ -]$/.test(out)) ? '' : "'";
    if (c.m.includes(SH) && i !== noDouble) cons += cons;
    out += cons + (v ? VSOUND[v] : '');
    pv = v === F ? 'a' : v === K ? 'i' : v === D ? 'ou' : v === FT ? 'an' : '';
  }
  return out;
}

/* Chronologie : séance minimale nécessaire pour lire une chaîne */
function chrono(str) {
  const cl = clusters(str); const need = []; let max = 0;
  const add = (s, label) => { if (s > max) max = s; need.push({ s, label }); };
  const art = cl.length > 2 && cl[0].b === 'ا' && cl[1].b === 'ل';
  if (art) add(5, 'article ال');
  cl.forEach((c, i) => {
    const b = c.b;
    if (b === '' || b === ' ') { /* rien */ }
    else if (b === 'ا') {
      const p = cl[i - 1];
      if (p && p.m.includes(FT) && !c.m.length) add(1, 'ا après fathatayn');
      else if (!(art && i === 0)) add(2, 'ا (prolongation)');
      if (c.m.length) add(99, 'ا avec une haraka (hors cours)');
    }
    else if (CHAR_S[b]) add(CHAR_S[b], b);
    else add(99, b + ' (hors cours)');
    c.m.forEach(m => add(MARK_S[m] || 99, (HNAME[m] || 'signe') + (MARK_S[m] ? '' : ' (hors cours)')));
  });
  return { max, need };
}
function chronoIssues(str, s) {
  const seen = {}; return chrono(str).need.filter(x => x.s > s && !seen[x.label] && (seen[x.label] = 1));
}
const issueText = iss => iss.map(x => x.s >= 99 ? x.label : `${x.label} (séance ${x.s})`).join(', ');

/* =====================================================================
   4. AFFICHAGE DE L'ARABE : CALQUES COLORÉS + LETTRE EN ROUGE
   Un calque par famille de harakat (bleu / orange / marron) sous un calque
   « lettres + signes neutres ». Tous les calques ont exactement le même texte
   (mêmes lettres, mêmes ZWJ, mêmes chedda), donc la liaison ne casse pas.
   ===================================================================== */
const RJ_ONLY = 'اأإآدذرزوؤةى';
const isArLetter = b => !!b && /[\u0620-\u064A]/.test(b);
const joinsL = b => b === TW || (isArLetter(b) && !RJ_ONLY.includes(b) && b !== 'ء');
const joinsR = b => b === TW || (isArLetter(b) && b !== 'ء');
const famOf = m => FAM.a.includes(m) ? 'a' : FAM.i.includes(m) ? 'i' : FAM.u.includes(m) ? 'u' : null;

function arHTML(str, opt = {}) {
  const cl = clusters(str, true);
  const hl = new Set(opt.hlIdx ? [...opt.hlIdx] : []);
  if (opt.hl) cl.forEach((c, i) => { if (opt.hl.includes(c.b)) hl.add(i); });
  [...hl].forEach(i => {
    if (!cl[i]) return;
    if (cl[i].b === 'ل' && cl[i + 1] && 'اأإآ'.includes(cl[i + 1].b)) hl.add(i + 1);
    if ('اأإآ'.includes(cl[i].b) && cl[i - 1] && cl[i - 1].b === 'ل') hl.add(i - 1);
  });
  const cls = opt.bad ? 'bad' : 'hl';
  const build = keep => {
    let h = '', i = 0;
    while (i < cl.length) {
      if (!hl.has(i)) { const c = cl[i]; h += esc(c.b + c.m.filter(keep).join('')); i++; continue; }
      let j = i; while (hl.has(j + 1) && j + 1 < cl.length) j++;
      const prev = cl[i - 1], next = cl[j + 1];
      const pre = prev && joinsL(prev.b) && joinsR(cl[i].b) ? ZWJ : '';
      const post = next && joinsL(cl[j].b) && joinsR(next.b) ? ZWJ : '';
      let t = ''; for (let k = i; k <= j; k++) t += cl[k].b + cl[k].m.filter(keep).join('');
      h += pre + '<span class="' + cls + '">' + pre + esc(t) + post + '</span>' + post;
      i = j + 1;
    }
    return h;
  };
  const all = cl.flatMap(c => c.m);
  let h = '<span class="ar' + (opt.cls ? ' ' + opt.cls : '') + '" dir="rtl" lang="ar" role="img" aria-label="' + esc(canon(str)) + '">';
  ['a', 'i', 'u'].forEach(f => {
    if (all.some(m => famOf(m) === f)) h += '<span class="lay lay-' + f + '" aria-hidden="true">' + build(m => famOf(m) === null || famOf(m) === f) + '</span>';
  });
  h += '<span class="lay-top" aria-hidden="true">' + build(m => famOf(m) === null) + '</span></span>';
  return h;
}

function formsFor(card) {
  const P = `S${card.s}_${card.slug}`, out = [];
  const add = (ar, forme, ph) => out.push({ ar, forme, audio: forme === 'nom' ? P : `${P}_${forme}`, ph: ph || translit(ar) });
  const c = card.letter;
  switch (card.slug) {
    case 'harakat': add(TW + F, 'fatha', 'fatha : « a »'); add(TW + K, 'kasra', 'kasra : « i »'); add(TW + D, 'damma', 'damma : « ou »'); return out;
    case 'tanwin': add(TW + FT + 'ا', 'fathatayn', 'fathatayn : « an »'); add(TW + KT, 'kasratayn', 'kasratayn : « in »'); add(TW + DT, 'dammatayn', 'dammatayn : « oun »'); return out;
    case 'soukoun': add('بَسْ', 'ex1'); add('بِنْ', 'ex2'); add('سُنْ', 'ex3'); return out;
    case 'chedda': add('بَبَّ', 'ex1'); add('سِسِّ', 'ex2'); add('نُنُّ', 'ex3'); return out;
    case 'article': add('الْبَابُ', 'ex1', 'al-baabou (lunaire)'); add('السَّبَبُ', 'ex2', 'as-sababou (solaire)'); add('الْكَلْبُ', 'ex3', 'al-kalbou (lunaire)'); add('الذِّئْبُ', 'ex4', "adh-dhi'bou (solaire)"); return out;
    case 'alif': add('ا', 'nom', 'alif : prolonge le son'); add('بَا', 'aa'); add('بِي', 'ii'); add('بُو', 'ou'); return out;
    case 'hamza': add('ء', 'nom', 'hamza : on ne prononce que la haraka'); add('أَ', 'fatha'); add('إِ', 'kasra'); add('أُ', 'damma'); return out;
  }
  add(c, 'nom', `${card.name} : ${card.hint}`);
  add(c + F, 'fatha'); add(c + K, 'kasra'); add(c + D, 'damma');
  add(c + FT + (c === 'ة' ? '' : 'ا'), 'fathatayn'); add(c + KT, 'kasratayn'); add(c + DT, 'dammatayn');
  if (c === 'ة') { add(TW + 'ة', 'pause', 'a(h) : en fin de phrase'); return out; }
  if (card.s >= 2) { add(c + F + 'ا', 'aa'); add(c + K + 'ي', 'ii'); add(c + D + 'و', 'ou'); }
  if (card.s >= 3) { add(c + SK, 'soukoun'); add(c + SH + F, 'chedda'); }
  return out;
}

function defaultContent() {

  })));
  const cnt = {};
  WORDS_DEFAULT.forEach(([s, ar, ph, src, sens, verif]) => {

    items.push({ id: uid(), type: 'mot', seance: s, ordre: cnt[s], arabe: ar, phonetique: ph, source: src, audio: `S${s}_mot${pad(cnt[s])}`, sens: sens || '', verif: !!verif });
  });

}

}

const phonOf = ar => { const it = itemFor(ar); return it && it.forme !== 'nom' && it.phonetique ? it.phonetique : translit(ar); };

const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open('alq-audio', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('a');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  all() {
    return new Promise(res => {
      if (!this.db) return res({});
      const out = {};
      try {
        const rq = this.db.transaction('a').objectStore('a').openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
        rq.onerror = () => res(out);
      } catch (e) { res(out); }
    });
  },
  put(k, v) {
    AUDIO_LOC[k] = v;
    return new Promise(res => {
      if (!this.db) return res(false);
      try { const tx = this.db.transaction('a', 'readwrite'); tx.objectStore('a').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); }
    });
  }
};

/* =====================================================================
   9. ANALYSE DES ERREURS (remédiation)
   ===================================================================== */
function analyze(given, expected, opt = {}) {
  const G = clusters(given), E = clusters(expected);
  const n = G.length, m = E.length;
  const d = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
  for (let i = 0; i <= n; i++) d[i][0] = i;
  for (let j = 0; j <= m; j++) d[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (G[i - 1].b === E[j - 1].b ? 0 : 1));
  const pairs = []; let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (G[i - 1].b === E[j - 1].b ? 0 : 1)) { pairs.unshift([i - 1, j - 1]); i--; j--; }
    else if (j > 0 && d[i][j] === d[i][j - 1] + 1) { pairs.unshift([null, j - 1]); j--; }
    else { pairs.unshift([i - 1, null]); i--; }
  }
  const msgs = [], keys = [], dG = new Set(), dE = new Set(), letters = [];
  const say = (msg, key) => { if (!msgs.includes(msg)) msgs.push(msg); if (key && !keys.includes(key)) keys.push(key); };
  const isProlong = (arr, k) => { const c = arr[k], p = arr[k - 1]; return c && !c.m.length && 'اوي'.includes(c.b) && p && vowelOf(p) && LONG[vowelOf(p)] === c.b; };
  const A = s => `<span dir="rtl" lang="ar">${arHTML(s)}</span>`;
  pairs.forEach(([gi, ei]) => {
    const g = gi != null ? G[gi] : null, e = ei != null ? E[ei] : null;
    if (g && e) {
      if (g.b !== e.b) {
        dG.add(gi); dE.add(ei); letters.push(e.b, g.b);
        say(`tu as confondu ${A(g.b)} et ${A(e.b)}`, 'L:' + [g.b, e.b].sort().join('/'));
      }
      if (opt.ignoreMarks) return;
      const gv = vowelOf(g), ev = vowelOf(e);
      if (ev && !gv) { dG.add(gi); dE.add(ei); say(`il manque la ${HNAME[ev]} sur ${A(e.b)}`, 'H:' + HNAME[ev] + '/aucune'); }
      else if (gv && !ev) { dG.add(gi); dE.add(ei); say(`${HNAME[gv]} en trop sur ${A(e.b)}`, 'H:' + HNAME[gv] + '/aucune'); }
      else if (gv && ev && gv !== ev) { dG.add(gi); dE.add(ei); letters.push(e.b); say(`${HNAME[gv]} au lieu de ${HNAME[ev]}`, 'H:' + [HNAME[gv], HNAME[ev]].sort().join('/')); }
      if (e.m.includes(SH) && !g.m.includes(SH)) { dG.add(gi); dE.add(ei); say('il manque la chedda', 'chedda'); }
      if (!e.m.includes(SH) && g.m.includes(SH)) { dG.add(gi); dE.add(ei); say('chedda en trop', 'chedda'); }
      if (e.m.includes(SK) && !g.m.includes(SK)) { dG.add(gi); dE.add(ei); say('il manque le soukoun', 'soukoun'); }
      if (!e.m.includes(SK) && g.m.includes(SK)) { dG.add(gi); dE.add(ei); say('soukoun en trop', 'soukoun'); }
    } else if (e) {
      dE.add(ei);
      if (e.b === ' ') say('il manque un espace entre les mots', 'espace');
      else if (isProlong(E, ei)) say('prolongation oubliée', 'prolongation');
      else if (e.b === 'ا' && E[ei - 1] && E[ei - 1].m.includes(FT)) say('il manque le alif après la fathatayn', 'alif-tanwin');
      else { letters.push(e.b); say(`il manque la lettre ${A(e.b)}`, 'manque:' + e.b); }
    } else if (g) {
      dG.add(gi);
      if (g.b === ' ') say('espace en trop', 'espace');
      else if (isProlong(G, gi)) say('prolongation en trop : ici le son est court', 'prolongation');
      else say(`la lettre ${A(g.b)} est en trop`, 'trop:' + g.b);
    }

  if (!msgs.length) say('regarde bien les deux réponses', null);

}
function confLabel(k) {
  if (k.startsWith('L:') || k.startsWith('H:')) return k.slice(2).replace('/aucune', ' oubliée');
  return ({ pos: 'position dans le mot', sol: 'solaire/lunaire', 'alif-tanwin': 'alif du tanwin' })[k] || k.replace('manque:', 'lettre oubliée ').replace('trop:', 'lettre en trop ');
}

/* =====================================================================
   10. FABRIQUE DES QUESTIONS (toujours limitée aux lettres vues)
   ===================================================================== */
function mcqAr(title, prompt, target, options, extra = {}) {
  return Object.assign({ kind: 'mcq', title, prompt, expected: target, audio: audioOf(target), options: shuffle(uniq(options)).map(ar => ({ ar })), card: CARD_OF_CH[clusters(target).map(c => c.b).find(b => CARD_OF_CH[b])] }, extra);
}
const withTanwinAlif = (l, m) => l + m + (m === FT && l !== 'ة' ? 'ا' : '');
function qHaraka(l, tanwin) {
  const marks = tanwin ? [FT, KT, DT] : [F, K, D];
  const opts = marks.map(m => withTanwinAlif(l, m)); const t = pick(opts);
  return mcqAr(tanwin ? 'Quel tanwin ?' : 'Quelle haraka ?', `Quelle syllabe se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, opts, { card: CARD_OF_CH[l] });
}
function qHamza() { const opts = ['أَ', 'إِ', 'أُ']; const t = pick(opts); return mcqAr('Quelle haraka ?', `Quelle hamza se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, opts, { card: 'hamza' }); }
function qProlong(l) {
  const v = pick([F, K, D]); const long = l + v + LONG[v], short = l + v; const t = pick([long, short]);
  const other = l + (v === F ? K : F) + LONG[v === F ? K : F];
  return mcqAr('Court ou long ?', `Laquelle se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, [long, short, other], { card: CARD_OF_CH[l] });
}
function qSukun(s) {
  const p = pool(s); const a = pick(p), b = pick(p);
  const opts = [a + F + b + SK, a + F + b + F, a + F + b + K]; const t = opts[0];
  return mcqAr('Le soukoun', `Laquelle se lit <b>« ${esc(translit(t))} »</b> ?`, t, opts, { card: 'soukoun' });
}
function qShadda(l) {
  const h = pick([F, K, D]); const withS = 'بَ' + l + SH + h, without = 'بَ' + l + h; const t = pick([withS, without]);
  return mcqAr('La chedda', `Laquelle se lit <b>« ${esc(translit(t))} »</b> ?`, t, [withS, without], { card: CARD_OF_CH[l] });
}
function qDiscrim(l, s) {
  const g = GROUPS.find(x => x.includes(l)); if (!g) return null;
  const mem = g.filter(x => (CHAR_S[x] || 99) <= s); if (mem.length < 2 || !mem.includes(l)) return null;
  const opts = mem.slice(0, 4).map(x => x + F); const t = l + F;
  return mcqAr('Lettres qui se ressemblent', `Quelle lettre se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, opts, { card: CARD_OF_CH[l] });
}
function qEmph(l, s) {
  const p = EMPH.find(x => x.includes(l)); if (!p || p.some(x => (CHAR_S[x] || 99) > s)) return null;
  const heavy = Math.random() < .5; const t = heavy ? p[1] : p[0];
  return mcqAr('Emphatique ou pas ?', heavy ? 'Laquelle est la lettre <b>emphatique</b> (son lourd) ?' : 'Laquelle est la lettre <b>légère</b> (non emphatique) ?', t + F, [p[0] + F, p[1] + F],
    { card: CARD_OF_CH[t], note: `${arHTML(p[1])} est emphatique (son lourd), ${arHTML(p[0])} est légère.` });
}
function qSol(l) {
  const sun = SUN.includes(l);
  return { kind: 'mcq', title: 'Solaire ou lunaire ?', prompt: 'Devant cette lettre, l\'article ال est-il solaire ou lunaire ?', display: 'ال' + ' ' + l, displayHTML: `${arHTML('ال')} <span class="muted" style="font-size:28px">+</span> ${arHTML(l)}`,
    options: [{ txt: 'Solaire ☀' }, { txt: 'Lunaire ☾' }], expectedTxt: sun ? 'Solaire ☀' : 'Lunaire ☾', card: 'article', missedLabel: 'ال + ' + l,
    explain: () => ({ msgs: [sun ? `${arHTML(l)} est une lettre solaire : le ل de ال ne se prononce pas et ${arHTML(l)} prend une chedda.` : `${arHTML(l)} est une lettre lunaire : on prononce le ل de ال (« al- »).`], keys: ['sol'], letters: [] }) };
}
function qPos(l, word) {
  const cl = clusters(word).filter(c => c.b && c.b !== ' ');
  if (cl.filter(c => c.b === l).length !== 1) return null;
  const i = cl.findIndex(c => c.b === l); const pos = i === 0 ? 'Début' : i === cl.length - 1 ? 'Fin' : 'Milieu';
  return { kind: 'mcq', title: 'Formes de la lettre', prompt: `Où se trouve ${arHTML(l)} dans ce mot ?`, display: word, displayHTML: arHTML(word), options: ['Début', 'Milieu', 'Fin'].map(txt => ({ txt })), expectedTxt: pos, card: CARD_OF_CH[l], missedLabel: word,
    explain: () => ({ msgs: [`${arHTML(l)} est ${pos === 'Début' ? 'au début' : pos === 'Fin' ? 'à la fin' : 'au milieu'} du mot (on lit de droite à gauche).`], keys: ['pos'], letters: [l] }) };
}
function qTiles(item, s) {
  return { kind: 'tiles', title: 'Reconstitue le mot', prompt: 'Écris ce mot avec les tuiles', ph: item.phonetique || translit(item.arabe), audio: item.audio, expected: item.arabe, s, card: CARD_OF_CH[clusters(item.arabe).map(c => c.b).find(b => CARD_OF_CH[b])] };
}

function stepStrings(st) {
  const a = [];
  if (st.expected) a.push(st.expected);
  if (st.display) a.push(st.display.replace(' ', ''));
  (st.options || []).forEach(o => o.ar && a.push(o.ar));
  if (st.item) a.push(st.item.arabe);
  return a;
}
const validStep = (st, s) => !!st && stepStrings(st).every(x => chronoIssues(x, s).length === 0);

function wordsFor(card, s) {
  const words = C.items.filter(it => it.type === 'mot' && Number(it.seance) === s && okForSession(it)).sort((a, b) => a.ordre - b.ordre);
  if (card.letter) return words.filter(w => clusters(w.arabe).some(c => c.b === card.letter));
  if (card.slug === 'tanwin') return words.filter(w => clusters(w.arabe).some(c => [FT, KT, DT].some(m => c.m.includes(m))));
  if (card.mark) return words.filter(w => clusters(w.arabe).some(c => c.m.includes(card.mark)) || card.slug === 'harakat');
  if (card.slug === 'article') return words.filter(w => canon(w.arabe).startsWith('ال'));
  return words;
}
const formsItems = slug => C.items.filter(it => it.type === 'lettre' && it.carte === slug && okForSession(it)).sort((a, b) => a.ordre - b.ordre);

function cardQuiz(card, s) {
  const q = [], L = card.letter, P = pool(s);
  const rep = (n, f) => { for (let i = 0; i < n; i++) q.push(f()); };
  switch (card.slug) {
    case 'harakat': rep(4, () => qHaraka(pick(P), false)); break;
    case 'tanwin': rep(3, () => qHaraka(pick(P), true)); q.push(qHaraka(pick(P), false)); break;
    case 'alif': rep(4, () => qProlong(pick(P))); break;
    case 'soukoun': rep(3, () => qSukun(s)); break;
    case 'chedda': rep(3, () => qShadda(pick(P))); break;
    case 'article': shuffle(LETTERS.filter(l => l.s <= s && !'اءة'.includes(l.ch))).slice(0, 5).forEach(l => q.push(qSol(l.ch))); break;
    case 'hamza': rep(3, qHamza); break;
    default:
      rep(2, () => qHaraka(L, false));
      q.push(qHaraka(L, true));
      if (s >= 2 && L !== 'ة') q.push(qProlong(L));
      if (s >= 3 && L !== 'ة') q.push(qShadda(L));
      q.push(qDiscrim(L, s));
      q.push(qEmph(L, s));
      if (s >= 5 && L !== 'ة') q.push(qSol(L));

  const words = wordsFor(card, s);
  if (L) { const w = shuffle(words).map(x => qPos(L, x.arabe)).find(Boolean); if (w) q.push(w); }
  let tw = shuffle(words).slice(0, 2);
  if (!tw.length) tw = shuffle(formsItems(card.slug).filter(f => f.forme !== 'nom' && letterCount(f.arabe) >= 2)).slice(0, 1);
  tw.forEach(w => q.push(qTiles(w, s)));
  return q.filter(st => validStep(st, s));
}

function buildMini(key, s) {
  const qs = [], P = pool(s), n = 4;
  if (key.startsWith('L:')) {
    const [a, b] = key.slice(2).split('/');
    if (!P.includes(a) || !P.includes(b)) return [];
    for (let i = 0; i < n; i++) { const h = pick([F, K, D]); const t = pick([a, b]) + h; qs.push(mcqAr('Entraînement ciblé', `Laquelle se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, [a + h, b + h])); }
  } else if (key.startsWith('H:')) {
    const [x, y] = key.slice(2).split('/').map(v => NAME2MARK[v]);
    if (!x || !y) return [];
    for (let i = 0; i < n; i++) { const l = pick(P); const o = [withTanwinAlif(l, x), withTanwinAlif(l, y)]; const t = pick(o); qs.push(mcqAr('Entraînement ciblé', `Laquelle se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, o)); }
  } else if (key === 'chedda' && s >= 3) { for (let i = 0; i < n; i++) qs.push(qShadda(pick(P))); }
  else if (key === 'soukoun' && s >= 3) { for (let i = 0; i < n; i++) qs.push(qSukun(s)); }
  else if (key === 'prolongation' && s >= 2) { for (let i = 0; i < n; i++) qs.push(qProlong(pick(P))); }
  else if (key === 'sol' && s >= 5) { shuffle(LETTERS.filter(l => l.s <= s && !'اءة'.includes(l.ch))).slice(0, n).forEach(l => qs.push(qSol(l.ch))); }
  return qs.filter(st => validStep(st, s)).map(st => Object.assign(st, { mini: true }));
}

let S = null, KB = null, fbTimer = null;

/* ---- a) écran « formes de la lettre » ---- */

/* ---- notion (harakat, tanwin, prolongations…) ---- */

  tanwin: 'Le tanwin double la haraka et ajoute un son « n » à la fin du mot : « an », « in », « oun ». La fathatayn s\'écrit toujours avec un alif.',

    <button class="btn primary block" data-act="next">Commencer</button>`;

/* ---- b) carte recto / verso ---- */

function addTile(t) {
  if (!KB) return;
  if (isMark(t)) {
    const cl = clusters(KB.tokens.join('')); const last = cl[cl.length - 1];
    if (!last || !last.b || last.b === ' ') return toast('Commence par une lettre, puis ajoute la haraka');
    const hasV = !!vowelOf(last);
    if (VOWELS.includes(t) && (hasV || last.m.includes(SK))) return toast('Une lettre ne porte qu\'une seule haraka');
    if (t === SK && (hasV || last.m.includes(SK) || last.m.includes(SH))) return toast('Le soukoun ne va pas avec une autre haraka');
    if (t === SH && (last.m.includes(SH) || last.m.includes(SK))) return toast('Cette lettre a déjà un signe');
  }
  KB.tokens.push(t); renderAns();
}

const confLabelHTML = k => k.startsWith('L:') ? k.slice(2).split('/').map(x => arHTML(x)).join(' / ') : esc(confLabel(k));

/* ---- réponse ---- */
function answer(st, given, correct) {
  const first = !st.retry && !st.mini;
  if (first) { S.total++; if (correct) S.ok++; }
  $$('.opt,.tile,#valrow button,.kb-ctrl button').forEach(b => b.disabled = true);
  const fb = $('#fb');
  if (correct) {
    fb.innerHTML = `<div class="fb-ok">${ICON.check}<span>${pick(['Bravo !', 'C\'est juste !', 'Très bien !', 'Parfait !'])}</span></div>`;
    fbTimer = setTimeout(next, 900);
    return;
  }
  const an = st.explain ? st.explain(given) : analyze(given, st.expected, { ignoreMarks: st.ignoreMarks });
  if (first) S.missed.push(st.missedLabel || st.expected);
  if (!st.mini) {
    an.keys.forEach(k => {
      S.conf[k] = (S.conf[k] || 0) + 1;
      if (S.conf[k] === 2 && !S.miniDone[k] && !S.pendingMini) {
        const qs = buildMini(k, S.s); S.miniDone[k] = 1;
        if (qs.length) S.pendingMini = { key: k, qs };
      }
    });
    st.tries = (st.tries || 0) + 1;
    if (st.tries <= 2) {
      const clone = Object.assign({}, st, { retry: true, tries: st.tries });
      if (clone.options) clone.options = shuffle(clone.options);
      S.steps.splice(Math.min(S.i + 3, S.steps.length), 0, clone);
    }
  }
  fb.innerHTML = remedHTML(st, given, an);
  fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function remedHTML(st, given, an) {
  let cmp;
  if (st.expectedTxt) cmp = `<div><p class="lbl">Ta réponse</p><p class="txtans">${esc(given)}</p></div><div class="good"><p class="lbl">Bonne réponse</p><p class="txtans">${esc(st.expectedTxt)}</p></div>`;
  else {
    const strip = (str, diff) => `<div class="strip">${clusters(str).map((c, i) => c.b === ' ' ? '<span class="sp"></span>' : `<span class="cl${diff.has(i) ? ' bad' : ''}">${arHTML(cstr(c))}</span>`).join('')}</div>`;
    cmp = `<div><p class="lbl">Ta réponse</p>${given ? arHTML(given, { hlIdx: an.dG, bad: true }) : '<p class="txtans">—</p>'}${given ? strip(given, an.dG) : ''}</div>
      <div class="good"><p class="lbl">Bonne réponse</p>${arHTML(st.expected, { hlIdx: an.dE, bad: true })}${strip(st.expected, an.dE)}</div>`;
  }
  const cards = uniq([...(an.letters || []).map(b => CARD_OF_CH[b]), st.card].filter(Boolean)).slice(0, 2);
  const aud = st.audio && audioURL(st.audio) ? `<button class="btn soft" data-play="${esc(st.audio)}">${ICON.play} Réécouter</button>` : '';
  return `<div class="remed" role="alert"><h3>Pas tout à fait. Regardons ensemble.</h3>
    <div class="cmp">${cmp}</div>
    <ul class="msgs">${an.msgs.map(m => `<li>${m.charAt(0).toUpperCase() + m.slice(1)}.</li>`).join('')}${st.note ? `<li>${st.note}</li>` : ''}</ul>
    <div class="remed-actions">${aud}${cards.map(sl => `<button class="btn soft" data-act="see-card" data-slug="${sl}">Revoir ${CARDS[sl].letter ? arHTML(CARDS[sl].letter) : esc(CARDS[sl].name)}</button>`).join('')}</div>
    <p class="small muted">${st.mini ? '' : 'Pas de souci : cette question reviendra un peu plus loin.'}</p>
    <button class="btn primary block" data-act="continue">Continuer</button></div>`;
}
function continueAfterError() {
  if (S.pendingMini) {
    const { key, qs } = S.pendingMini; S.pendingMini = null;
    S.steps.splice(S.i + 1, 0, { kind: 'mini-intro', key, count: qs.length }, ...qs);
  }
  next();
}

/* ---- fin de série ---- */
function renderResult() {
  const score = `${S.ok}/${S.total}`, date = today();
  const confKeys = Object.keys(S.conf).filter(k => !k.includes('aucune') || true);
  const better = (old) => !old || !old.best || (S.total && (S.ok / S.total) >= (old.bestRatio || 0));
  if (S.kind === 'serie') { const o = P.cards[S.slug] || {}; P.cards[S.slug] = Object.assign(o, { done: 1, last: score, date }, better(o) ? { best: score, bestRatio: S.total ? S.ok / S.total : 1 } : {}); }
  if (S.kind === 'revision') { const o = P.revisions[S.s] || {}; P.revisions[S.s] = Object.assign(o, { last: score, date }, better(o) ? { best: score, bestRatio: S.total ? S.ok / S.total : 1 } : {}); }
  if (S.kind === 'dictee') { const o = P.dictees[S.did] || {}; P.dictees[S.did] = Object.assign(o, { last: score, date, s: S.s, num: S.num }, better(o) ? { best: score, bestRatio: S.total ? S.ok / S.total : 1 } : {}); }
  saveP();
  const missed = uniq(S.missed);
  const pct = S.total ? S.ok / S.total : 1;
  const msg = pct === 1 ? 'Sans faute, bravo !' : pct >= .7 ? 'Très bon travail !' : 'Beau travail : chaque erreur t\'a fait progresser.';
  main().innerHTML = `${seriesTop()}<div class="result">
    <p class="step-lbl">${esc(S.label)}</p><h2 class="step-title">${esc(S.title)}</h2><hr class="rule">
    ${S.total ? `<p class="score">${S.ok}<small>/${S.total}</small></p>` : ''}
    <p class="prompt">${msg}</p>
    ${S.flashOk + S.flashRev ? `<p class="muted small">Cartes : ${S.flashOk} « je savais », ${S.flashRev} « à revoir »</p>` : ''}
    ${missed.length ? `<p class="lbl">${S.kind === 'dictee' ? 'Mots à retravailler' : 'À retravailler'}</p><div class="chips">${missed.map(m => `<span class="chip">${/[\u0600-\u06FF]/.test(m) ? arHTML(m) : esc(m)}</span>`).join('')}</div>` : ''}
    ${confKeys.length ? `<p class="lbl">Confusions</p><div class="chips">${confKeys.map(k => `<span class="chip">${confLabelHTML(k)}</span>`).join('')}</div>` : ''}
    <div class="stack" style="margin-top:18px">
      <button class="btn wa block" data-act="send-result">Envoyer mon résultat au prof</button>
      <button class="btn soft block" data-act="restart">Recommencer</button>
      <button class="btn ghost block" data-act="home">Retour à l'accueil</button>
    </div></div>`;
}
function resultMessage() {
  const missed = uniq(S.missed), conf = Object.keys(S.conf).map(confLabel);
  return `${ELEVE.prenom || 'Élève'} – ${S.title} – Score ${S.ok}/${S.total} – ${today()}\n`

function progressMessage() {
  let t = `${ELEVE.prenom || 'Élève'} – Ma progression – ${today()}`;
  for (let s = 1; s <= 8; s++) {
    const cards = sessionCards(s), done = cards.filter(c => cardDone(c.slug));
    const parts = [`${done.length}/${cards.length} cartes`];
    done.forEach(c => parts.push(`${c.letter || c.name} ${P.cards[c.slug].best || ''}`.trim()));
    if (P.revisions[s]) parts.push(`révision ${P.revisions[s].best}`);
    Object.values(P.dictees).filter(d => d.s === s).forEach(d => parts.push(`dictée n°${d.num} ${d.best}`));
    t += `\nSéance ${pad(s)} : ${parts.join(', ')}`;
  }

}

function dicteesOf(s) {
  const g = {};
  C.items.filter(it => it.type === 'dictee' && Number(it.seance) === s).forEach(it => { const d = Number(it.dictee) || 1; (g[d] = g[d] || []).push(it); });
  return Object.keys(g).map(Number).sort((a, b) => a - b).map(d => ({ s, d, id: `${s}_${d}`, words: g[d].sort((a, b) => a.ordre - b.ordre) }));
}
const harakatRequired = id => !(C.dicteeSettings[id] && C.dicteeSettings[id].harakat === false);
function renderDictees() {
  let h = `<h1 class="page-title" style="margin-top:18px">Dictées</h1><hr class="rule"><p class="muted">Écoute le mot, puis écris-le avec les tuiles. Tu peux réécouter autant que tu veux.</p>`;
  for (let s = 1; s <= 8; s++) {
    const ds = dicteesOf(s);
    h += `<section class="session"><div class="s-head"><span class="s-num">${pad(s)}</span><span class="s-lbl">Séance</span></div><hr class="rule"><div class="dlist">`;
    h += ds.length ? ds.map(d => { const p = P.dictees[d.id]; return `<button class="ditem" data-act="dictee" data-id="${d.id}"><span><b>Dictée séance ${s} n°${d.d}</b><br><span class="small muted">${d.words.length} mot${d.words.length > 1 ? 's' : ''}${p ? ` — meilleur score ${p.best}` : ''}</span></span>${ICON.play}</button>`; }).join('')
      : '<p class="empty">Pas encore de dictée pour cette séance.</p>';
    h += '</div></section>';
  }
  main().innerHTML = h;
}
function openDictee(id) {
  const [s, d] = id.split('_').map(Number);
  const dict = dicteesOf(s).find(x => x.d === d); if (!dict) return;
  const words = dict.words.filter(okForSession);
  const ign = !harakatRequired(id);
  const steps = words.map((w, i) => ({ kind: 'dictee', item: w, num: i + 1, s, expected: w.arabe, audio: w.audio, ph: w.phonetique || translit(w.arabe), ignoreMarks: ign, card: CARD_OF_CH[clusters(w.arabe).map(c => c.b).find(b => CARD_OF_CH[b])] }));
  startSeries({ kind: 'dictee', s, num: d, did: id, title: `Dictée séance ${s} n°${d}`, label: `Dictée séance ${s} n°${d}`, steps });
}

function suggestKey(f) {
  const s = f.seance;
  if (f.type === 'mot') return `S${s}_mot${pad(f.ordre)}`;
  if (f.type === 'dictee') return `S${s}_dictee${f.dictee || 1}_mot${pad(f.ordre)}`;
  const card = CARDS[f.carte]; return card ? `S${card.s}_${card.slug}${f.forme && f.forme !== 'nom' ? '_' + f.forme : ''}` : `S${s}_lettre${pad(f.ordre)}`;
}

let REC = null;
async function toggleRec() {
  if (REC) { REC.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Enregistrement non disponible sur ce navigateur');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ['audio/mp4', 'audio/aac', 'audio/mpeg', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); const chunks = [];
    rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); REC = null;
      const blob = new Blob(chunks, { type: (rec.mimeType || mime || 'audio/mp4').split(';')[0] });
      if (EDIT) { EDIT.pending = await blobToDataURL(blob); EDIT.remove = false; }
      renderEditAudio(); toast('Enregistrement prêt : pense à enregistrer l\'élément');
    };
    rec.start(); REC = rec; renderEditAudio();
  } catch (e) { toast('Micro refusé ou indisponible'); }
}
function stopRec() { if (REC) { try { REC.stop(); } catch (e) { } } }
async function saveEdit() {
  const f = editFields();
  if (!f.arabe) return toast('Écris le mot en arabe');
  if (!f.audio) f.audio = suggestKey(f);
  const iss = chronoIssues(f.arabe, f.seance);
  if (iss.length && !confirm(`Cet élément utilise ${issueText(iss)}, pas encore vu(e) en séance ${f.seance}. Il sera masqué pour les élèves. Enregistrer quand même ?`)) return;
  if (!f.phonetique) f.phonetique = translit(f.arabe);
  if (f.type !== 'lettre') { delete f.carte; delete f.forme; }
  if (f.type !== 'dictee') delete f.dictee;
  if (EDIT.id) { const it = C.items.find(x => x.id === EDIT.id); Object.keys(it).forEach(k => { if (!['id'].includes(k) && !(k in f)) delete it[k]; }); Object.assign(it, f); }
  else C.items.push(Object.assign({ id: uid() }, f));
  if (EDIT.pending) await IDB.put(f.audio, EDIT.pending);
  else if (EDIT.remove) await IDB.put(f.audio, '');
  saveContent(); closeModal(); renderAdmin(); toast('Élément enregistré');
}

/* ---- import des audios ---- */
async function importAudios(files) {
  const keys = {}; C.items.forEach(it => { if (it.audio) keys[it.audio.toLowerCase()] = it.audio; });
  const ok = [], bad = [];
  for (const f of files) {
    const ext = (f.name.split('.').pop() || '').toLowerCase(), base = f.name.replace(/\.[^.]+$/, '').trim();
    const k = keys[base.toLowerCase()];
    if (!k) { bad.push(f.name); continue; }
    const url = await blobToDataURL(new Blob([f], { type: MIME[ext] || f.type || 'audio/mpeg' }));
    await IDB.put(k, url); ok.push(k);
  }
  const missing = C.items.filter(it => !audioURL(it.audio)).length;
  ADM.report = `<b>${ok.length} audio(s) intégré(s)</b>${ok.length ? ' : ' + esc(ok.join(', ')) : ''}\n<b>${bad.length} fichier(s) non reconnu(s)</b>${bad.length ? ' : ' + esc(bad.join(', ')) : ''}\n${missing} élément(s) encore sans audio.`;
  ADM.open.audios = true; renderAdmin();
}

/* ---- CSV ---- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, ''); const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ';') { row.push(f); f = ''; } else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (ch !== '\r') f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const csvCell = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function exportCSV() {
  const lines = ['type;seance;ordre;arabe;phonetique;source;audio'];
  C.items.slice().sort((a, b) => a.seance - b.seance || a.type.localeCompare(b.type) || (a.dictee || 0) - (b.dictee || 0) || a.ordre - b.ordre)
    .forEach(it => lines.push([it.type, it.seance, it.type === 'dictee' ? `${it.dictee || 1}.${pad(it.ordre)}` : it.ordre, it.arabe, it.phonetique, it.source, it.audio].map(csvCell).join(';')));
  download('\uFEFF' + lines.join('\r\n'), `contenu-arabe-${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv;charset=utf-8');
}
function importCSV(text, mode) {
  const rows = parseCSV(text); if (!rows.length) return toast('Fichier vide');
  if (/type/i.test(rows[0][0])) rows.shift();
  const items = []; let skipped = 0;
  rows.forEach(r => {
    let [type, seance, ordre, arabe, phon, source, audio] = r.map(x => (x || '').trim());
    type = type.toLowerCase().replace('é', 'e'); if (!['lettre', 'mot', 'dictee'].includes(type) || !arabe) { skipped++; return; }
    const it = { id: uid(), type, seance: Number(seance) || 1, ordre: 1, arabe: canon(arabe), phonetique: phon || translit(arabe), source: /inv/i.test(source) ? 'invente' : 'reel', audio: audio || '' };
    if (type === 'dictee') {
      const md = /dictee(\d+)/i.exec(audio), mm = /mot(\d+)/i.exec(audio);
      const parts = String(ordre).split(/[.,]/);
      it.dictee = md ? Number(md[1]) : parts.length > 1 ? Number(parts[0]) : 1;
      it.ordre = mm && !(parts.length > 1) ? Number(mm[1]) : Number(parts[parts.length - 1]) || 1;
    } else it.ordre = Number(ordre) || 1;
    if (type === 'lettre') {
      const mk = /^S\d+_([^_]+)(?:_(.+))?$/i.exec(audio);
      if (mk && CARDS[mk[1]]) { it.carte = mk[1]; it.forme = mk[2] || 'nom'; }
      else { const b = clusters(arabe).map(c => c.b).find(x => CARD_OF_CH[x]); it.carte = CARD_OF_CH[b] || ''; it.forme = ''; }
    }
    if (!it.audio) it.audio = suggestKey(it);
    items.push(it);
  });
  if (mode === 'replace') { if (!confirm(`Remplacer tout le contenu par les ${items.length} lignes du CSV ?`)) return; C.items = items; }
  else C.items.push(...items);
  saveContent(); renderAdmin(); toast(`${items.length} ligne(s) importée(s)${skipped ? `, ${skipped} ignorée(s)` : ''}`);
}

/* ---- fichiers générés ---- */
function mergedAudios() { const m = Object.assign({}, AUDIO_EMB); Object.keys(AUDIO_LOC).forEach(k => { if (AUDIO_LOC[k]) m[k] = AUDIO_LOC[k]; else delete m[k]; }); return m; }
function buildHTML() {
  const j = o => JSON.stringify(o).replace(/</g, '\\u003c');
  const content = Object.assign({}, C, { updatedAt: C.updatedAt || Date.now() });
  return SOURCE_HTML
    .replace(/(<script id="app-data" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + j(content) + b)
    .replace(/(<script id="app-audio" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + j(mergedAudios()) + b);
}
function download(text, name, type) {
  const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  return blob.size;
}
const mo = n => (n / 1048576).toFixed(1).replace('.', ',') + ' Mo';

  'adm-csv-export': exportCSV,
  'adm-backup': () => { const size = download(JSON.stringify({ kind: 'alq-sauvegarde', date: new Date().toISOString(), content: C, audios: mergedAudios() }), `sauvegarde-arabe-${new Date().toISOString().slice(0, 10)}.json`, 'application/json'); toast('Sauvegarde téléchargée (' + mo(size) + ')'); },
  'adm-reset': () => { if (confirm('Revenir au contenu d\'origine de ce fichier ? Tes modifications locales (hors audios) seront effacées. Fais une sauvegarde avant si besoin.')) { localStorage.removeItem('alq_content'); loadContent(); renderAdmin(); toast('Contenu d\'origine rétabli'); } },
  'adm-download': () => {
    const h = buildHTML(); const size = new Blob([h]).size;
    download(h, `apprendre-arabe-${new Date().toISOString().slice(0, 10)}.html`, 'text/html');
    ADM.dlInfo = `Fichier généré : ${mo(size)}.${size > 12 * 1048576 ? '\n⚠ Le fichier approche 15 Mo : il risque d\'être lent à ouvrir sur téléphone. Pense à alléger les audios (mp3 mono, 64 kbit/s).' : ''}`;
    ADM.open.html = true; renderAdmin();
  },
  'adm-copy': async () => { const h = buildHTML(); try { await navigator.clipboard.writeText(h); toast('Code HTML copié : colle-le dans un fichier .html'); } catch (e) { toast('Copie impossible ici'); } }
};
const CHG = {
  'adm-filter-s': el => { ADM.s = el.value; renderAdmin(); },
  'adm-filter-t': el => { ADM.type = el.value; renderAdmin(); },
  'adm-dharakat': el => { C.dicteeSettings[el.dataset.id] = { harakat: el.checked }; saveContent(); toast('Réglage enregistré'); },
  'adm-audios': el => { if (el.files.length) importAudios([...el.files]); },
  'adm-file': async el => { const f = el.files[0]; if (!f) return; const ext = (f.name.split('.').pop() || '').toLowerCase(); EDIT.pending = await blobToDataURL(new Blob([f], { type: MIME[ext] || f.type || 'audio/mpeg' })); EDIT.remove = false; renderEditAudio(); toast('Audio prêt : pense à enregistrer l\'élément'); },
  'adm-csv': el => { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importCSV(String(r.result), el.dataset.mode); r.readAsText(f, 'utf-8'); el.value = ''; },
  'adm-restore': el => {
    const f = el.files[0]; if (!f) return; const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result); if (!d.content || !d.content.items) throw 0;
        if (!confirm('Restaurer cette sauvegarde ? Le contenu actuel sera remplacé.')) return;
        C = d.content; saveContent();
        for (const k of Object.keys(d.audios || {})) await IDB.put(k, d.audios[k]);
        renderAdmin(); toast('Sauvegarde restaurée');
      } catch (e) { toast('Ce fichier n\'est pas une sauvegarde valide'); }
    };
    r.readAsText(f); el.value = '';
  }
};
document.addEventListener('click', e => {
  const p = e.target.closest('[data-play]');
  if (p) { e.preventDefault(); play(p.dataset.play); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act] && !a.disabled) { e.preventDefault(); ACT[a.dataset.act](a, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flip-in')) { e.preventDefault(); ACT.flip(); } });

function askName(first) {
  const m = modal(`<h2>${first ? 'Bienvenue' : 'Mon prénom'}</h2><p class="muted">${first ? 'Comment t\'appelles-tu ? Ton prénom apparaîtra dans les résultats envoyés à ton professeur.' : 'Tu peux modifier ton prénom.'}</p>
    <div class="field"><label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name" value="${esc(ELEVE.prenom)}"></div>
    <button class="btn primary block" data-act="save-name">Enregistrer</button>`);
  const i = $('#prenom', m); i.addEventListener('keydown', e => { if (e.key === 'Enter') ACT['save-name'](); });
  setTimeout(() => i.focus(), 150);
}

/* =====================================================================
   17. DÉMARRAGE
   ===================================================================== */
async function boot() {
  loadContent();
  await IDB.open();
  const loc = await IDB.all(); Object.assign(AUDIO_LOC, loc);
  show('home');
  if (!ELEVE.prenom) askName(true);
  const bad = C.items.filter(it => !okForSession(it));
  if (bad.length) console.warn('Chronologie : éléments masqués', bad);
}
boot();

</script>
</body>
</html>
