async function importAudios(files) {
  const keys = {}; C.items.forEach(it => { if (it.audio) keys[it.audio.toLowerCase()] = it.audio; });
  const ok = [], bad = [];
  for (const f of files) {
    const ext = (f.name.split('.').pop() || '').toLowerCase(), base = f.name.replace(/\.[^.]+$/, '').trim();
    const k = keys[base.toLowerCase()];
    if (!k) { bad.push(f.name); continue; }
    const url = await blobToDataURL(new Blob([f], { type: MIME[ext] || f.type || 'audio/mpeg' }));
    await IDB.put(k, url); ok.push(k);
  }
  const missing = C.items.filter(it => !audioURL(it.audio)).length;
  ADM.report = `<b>${ok.length} audio(s) intégré(s)</b>${ok.length ? ' : ' + esc(ok.join(', ')) : ''}\n<b>${bad.length} fichier(s) non reconnu(s)</b>${bad.length ? ' : ' + esc(bad.join(', ')) : ''}\n${missing} élément(s) encore sans audio.`;
  ADM.open.audios = true; renderAdmin();
}

/* ---- CSV ---- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, ''); const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ';') { row.push(f); f = ''; } else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (ch !== '\r') f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const csvCell = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function exportCSV() {
  const lines = ['type;seance;ordre;arabe;phonetique;source;audio'];
  C.items.slice().sort((a, b) => a.seance - b.seance || a.type.localeCompare(b.type) || (a.dictee || 0) - (b.dictee || 0) || a.ordre - b.ordre)
    .forEach(it => lines.push([it.type, it.seance, it.type === 'dictee' ? `${it.dictee || 1}.${pad(it.ordre)}` : it.ordre, it.arabe, it.phonetique, it.source, it.audio].map(csvCell).join(';')));
  download('\uFEFF' + lines.join('\r\n'), `contenu-arabe-${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv;charset=utf-8');
}
function importCSV(text, mode) {
  const rows = parseCSV(text); if (!rows.length) return toast('Fichier vide');
  if (/type/i.test(rows[0][0])) rows.shift();
  const items = []; let skipped = 0;
  rows.forEach(r => {
    let [type, seance, ordre, arabe, phon, source, audio] = r.map(x => (x || '').trim());
    type = type.toLowerCase().replace('é', 'e'); if (!['lettre', 'mot', 'dictee'].includes(type) || !arabe) { skipped++; return; }
    const it = { id: uid(), type, seance: Number(seance) || 1, ordre: 1, arabe: canon(arabe), phonetique: phon || translit(arabe), source: /inv|syll/i.test(source) ? 'invente' : 'reel', audio: audio || '' };
    if (type === 'dictee') {
      const md = /dictee(\d+)/i.exec(audio), mm = /mot(\d+)/i.exec(audio);
      const parts = String(ordre).split(/[.,]/);
      it.dictee = md ? Number(md[1]) : parts.length > 1 ? Number(parts[0]) : 1;
      it.ordre = mm && !(parts.length > 1) ? Number(mm[1]) : Number(parts[parts.length - 1]) || 1;
    } else it.ordre = Number(ordre) || 1;
    if (type === 'lettre') {
      const mk = /^S\d+_([^_]+)(?:_(.+))?$/i.exec(audio);
      if (mk && CARDS[mk[1]]) { it.carte = mk[1]; it.forme = mk[2] || 'nom'; }
      else { const b = clusters(arabe).map(c => c.b).find(x => CARD_OF_CH[x]); it.carte = CARD_OF_CH[b] || ''; it.forme = ''; }
    }
    if (!it.audio) it.audio = suggestKey(it);
    items.push(it);
  });
  if (mode === 'replace') { if (!confirm(`Remplacer tout le contenu par les ${items.length} lignes du CSV ?`)) return; C.items = items; }
  else C.items.push(...items);
  saveContent(); renderAdmin(); toast(`${items.length} ligne(s) importée(s)${skipped ? `, ${skipped} ignorée(s)` : ''}`);
}

  const cl = [], re = /\[(\w)\|([^\]]*)\]/g; let last = 0, m;
  const push = (k, t) => { for (const ch of String(t).normalize('NFC')) { if (isMark(ch) && cl.length) cl[cl.length - 1].m += ch; else cl.push({ b: ch, m: '', k }); } };
  while ((m = re.exec(src))) { if (m.index > last) push(null, src.slice(last, m.index)); push(m[1], m[2]); last = re.lastIndex; }
  if (last < src.length) push(null, src.slice(last));
  let h = '', i = 0;
  while (i < cl.length) {
    const k = cl[i].k;
    let j = i; while (j + 1 < cl.length && cl[j + 1].k === k) j++;
    let t = ''; for (let x = i; x <= j; x++) t += cl[x].b + cl[x].m;
    if (!k) h += esc(t);
    else {
      const prev = cl[i - 1], next = cl[j + 1];
      const pre = prev && joinsL(prev.b) && joinsR(cl[i].b) ? ZWJ : '';
      const post = next && joinsL(cl[j].b) && joinsR(next.b) ? ZWJ : '';
      h += pre + `<span class="k-${k}">` + pre + esc(t) + post + '</span>' + post;
    }
    i = j + 1;
  }
  return `<span class="tj-ar" dir="rtl" lang="ar">${h}</span>`;
}

/* ---------- Animations et interactions ---------- */
function tjStop() {
  cancelAnimationFrame(TJ.raf); TJ.raf = 0;
  if (TJ.io) TJ.io.disconnect(); if (TJ.spy) TJ.spy.disconnect(); TJ.io = TJ.spy = null;
  if (TJ.onScroll) window.removeEventListener('scroll', TJ.onScroll); TJ.onScroll = null;
  TJ.timers.forEach(clearTimeout); TJ.timers = [];
  if (TJ.spyVis) TJ.spyVis.disconnect(); TJ.spyVis = null;
}
const tjLater = (f, ms) => TJ.timers.push(setTimeout(f, ms));
const tjReduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function tjStart() {
  tjStop();
  /* apparition au défilement */
  const els = $$('.tj-rv');
  if ('IntersectionObserver' in window) {
    TJ.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); TJ.io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: .08 });
    els.forEach(el => TJ.io.observe(el));
    TJ.spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) tjToc(e.target.dataset.spy); }), { rootMargin: '-45% 0px -50% 0px' });
    $$('[data-spy]').forEach(el => TJ.spy.observe(el));
  } else els.forEach(el => el.classList.add('in'));
  /* barre de progression */
  TJ.onScroll = () => { const p = $('#tjProg'); if (!p) return; const d = document.documentElement; const max = d.scrollHeight - innerHeight; p.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%'; };
  window.addEventListener('scroll', TJ.onScroll, { passive: true }); TJ.onScroll();
  /* carrousel des règles : points */
  const rules = $('#tjRules');
  if (rules) rules.addEventListener('scroll', () => { const i = Math.round(rules.scrollLeft / (rules.scrollWidth / 4)); $$('#tjDots i').forEach((d, k) => d.classList.toggle('on', k === Math.abs(i))); }, { passive: true });
  tjWay(TJ.link); tjStage(); tjQuizStart(); tjCanvas();
}

/* Lettres flottantes du héros + éclats au toucher */
function tjCanvas() {
  const cv = $('#tjCv'); if (!cv || tjReduced()) return;
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const size = () => { cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; };
  size();
  const W = () => cv.width / dpr, H = () => cv.height / dpr;
  const L = [...TJ_ALPHA].filter(x => x !== 'ء');
  const cols = ['#F59E0B', '#FF4FA3', '#22A7F0', '#16A34A', '#F7EFE6'];
  const parts = Array.from({ length: 22 }, () => ({ x: Math.random() * W(), y: Math.random() * H(), s: 16 + Math.random() * 34, v: .12 + Math.random() * .35, a: .05 + Math.random() * .13, ph: Math.random() * 6, ch: pick(L), c: '#F7EFE6', r: 0, life: -1 }));
  TJ.burst = (x, y) => { for (let i = 0; i < 14; i++) { const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4; parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1.5, s: 18 + Math.random() * 26, a: 1, ch: pick(L), c: pick(cols), r: (Math.random() - .5) * .3, life: 1 }); } };
  let visible = true;
  const vis = new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible && !TJ.raf) TJ.raf = requestAnimationFrame(tick); }); vis.observe(cv);
  const oldStop = TJ.spyVis; TJ.spyVis = vis; if (oldStop) oldStop.disconnect();
  function tick(t) {
    if (!document.body.contains(cv)) { vis.disconnect(); TJ.raf = 0; return; }
    if (!visible) { TJ.raf = 0; return; }
    if (cv.width !== cv.clientWidth * dpr) size();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W(), H());
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.life < 0) { p.y -= p.v; p.x += Math.sin(t / 1400 + p.ph) * .25; if (p.y < -40) { p.y = H() + 30; p.x = Math.random() * W(); p.ch = pick(L); } }
      else { p.x += p.vx; p.y += p.vy; p.vy += .08; p.life -= .016; p.a = Math.max(0, p.life); p.r += .01; if (p.life <= 0) { parts.splice(i, 1); continue; } }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r || 0); ctx.globalAlpha = p.a; ctx.fillStyle = p.c; ctx.font = `${p.s}px 'Noto Naskh Arabic', serif`; ctx.fillText(p.ch, 0, 0); ctx.restore();
    }
    TJ.raf = requestAnimationFrame(tick);
  }
  TJ.raf = requestAnimationFrame(tick);
}

/* Son : voix synthétique pour les durées, petits effets */
function tjAudio() {
  try { const A = TJ.ac || (TJ.ac = new (window.AudioContext || window.webkitAudioContext)()); if (A.state === 'suspended') A.resume(); return A; } catch (e) { return null; }
}
function tjTone(beats, opt = {}) {
  const A = tjAudio(); if (!A) return;
  const t0 = A.currentTime + .05, d = beats * TJ_BEAT;
  const o = A.createOscillator(), f = A.createBiquadFilter(), g = A.createGain();
  o.type = 'sawtooth'; o.frequency.value = opt.freq || 196;
  if (opt.nasal) { const lfo = A.createOscillator(), lg = A.createGain(); lfo.frequency.value = 5.5; lg.gain.value = 3; lfo.connect(lg).connect(o.frequency); lfo.start(t0); lfo.stop(t0 + d + .1); }
  f.type = 'lowpass'; f.frequency.value = opt.nasal ? 520 : 900; f.Q.value = opt.nasal ? 8 : 2;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.16, t0 + .06); g.gain.setValueAtTime(.16, t0 + d - .1); g.gain.linearRampToValueAtTime(0, t0 + d);
  o.connect(f).connect(g).connect(A.destination); o.start(t0); o.stop(t0 + d + .05);
  for (let i = 0; i < beats; i++) { const c = A.createOscillator(), cg = A.createGain(), ti = t0 + i * TJ_BEAT; c.frequency.value = i ? 1200 : 1600; cg.gain.setValueAtTime(.0001, ti); cg.gain.exponentialRampToValueAtTime(.12, ti + .005); cg.gain.exponentialRampToValueAtTime(.0001, ti + .07); c.connect(cg).connect(A.destination); c.start(ti); c.stop(ti + .09); }
}
function tjPop(freq = 520, dur = .12, type = 'triangle') {
  const A = tjAudio(); if (!A) return;
  const t0 = A.currentTime + .02, o = A.createOscillator(), g = A.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0); o.frequency.exponentialRampToValueAtTime(freq * .45, t0 + dur);
  g.gain.setValueAtTime(.25, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(A.destination); o.start(t0); o.stop(t0 + dur + .02);
}

  'س': 'aucun point', 'ش': 'trois points au-dessus', 'ص': 'aucun point', 'ض': 'un point au-dessus', 'ط': 'aucun point', 'ظ': 'un point au-dessus',
  'ع': 'aucun point', 'غ': 'un point au-dessus', 'ف': 'un point au-dessus', 'ق': 'deux points au-dessus' };
const EX_NAMES = { trouve: 'Trouve la lettre', meme: 'Même lettre', syll: 'Lis la syllabe', ecoute: 'Écoute et choisis', ecris: 'Écris la lettre', serie: 'Série', dictee: 'Dictée' };

/* --- Statistiques persistantes --- */
function ST() {
  if (!P.stats) P.stats = { v: 1, cat: {}, el: {}, log: [] };
  return P.stats;
}
/* ev = { ex, s, item, given, expected, ok, cat, sub, tests:[{cat,sub}] } */
function track(ev) {
  const st = ST(), date = today();
  const bump = (cat, sub, ok) => {
    if (!CATS[cat]) cat = 'autre';
    const c = st.cat[cat] || (st.cat[cat] = { ok: 0, err: 0 }); ok ? c.ok++ : c.err++;
    if (S && S.trk) { const t = S.trk[cat] || (S.trk[cat] = { ok: 0, err: 0 }); ok ? t.ok++ : t.err++; }
    if (sub == null) return;
    const k = cat + '|' + sub, e = st.el[k] || (st.el[k] = { cat, sub, n: 0, ok: 0 });
    if (ok) e.ok++; else { e.n++; e.given = ev.given; e.expected = ev.expected; e.ex = ev.ex; e.s = ev.s; e.item = ev.item; }
    e.last = date;
  };
  if (ev.ok) (ev.tests || []).forEach(t => bump(t.cat, t.sub, true));
  else (ev.errs || [{ cat: ev.cat, sub: ev.sub }]).forEach(t => bump(t.cat, t.sub, false));
  st.log.push({ t: Date.now(), ex: ev.ex, s: ev.s, item: ev.item, given: ev.given, expected: ev.expected, ok: !!ev.ok, cats: (ev.ok ? ev.tests : ev.errs || [{ cat: ev.cat, sub: ev.sub }]).map(x => x.cat + (x.sub ? ':' + x.sub : '')) });
  if (st.log.length > 300) st.log.splice(0, st.log.length - 300);
  saveP();
}
const pctOf = c => c && (c.ok + c.err) ? Math.round(c.ok / (c.ok + c.err) * 100) : null;

/* Séries existantes : on traduit les clés de analyze() en catégories */
function catsFromKeys(keys) {
  return keys.map(k => {
    if (k.startsWith('L:')) { const [a, b] = k.slice(2).split('/'); return { cat: isClose(a, b) ? 'proches' : 'lettre', sub: pairKey(a, b) }; }
    if (k.startsWith('H:')) return { cat: 'harakat', sub: k.slice(2).replace('/aucune', '') };
    if (k === 'chedda' || k === 'soukoun' || k === 'alif-tanwin') return { cat: 'harakat', sub: k };
    if (k === 'prolongation') return { cat: 'prolongation', sub: 'prolongation' };
    if (k === 'pos') return { cat: 'forme', sub: null };
    if (k === 'sol') return { cat: 'autre', sub: 'solaire / lunaire' };
    if (k.startsWith('manque:') || k.startsWith('trop:') || k === 'espace') return { cat: 'lecture', sub: null };
    return { cat: 'autre', sub: null };

}
function catOfStep(st) {
  if (st.kind === 'tiles' || st.kind === 'dictee') return 'lecture';
  const t = st.title || '';
  if (/haraka|tanwin|soukoun|chedda/i.test(t)) return 'harakat';
  if (/Court ou long/.test(t)) return 'prolongation';
  if (/ressemblent/.test(t)) return 'proches';
  if (/Formes/.test(t)) return 'forme';
  if (/Emphatique/.test(t)) return 'lettre';
  if (/Solaire/.test(t)) return 'autre';
  return 'lecture';
}
function trackStep(st, given, correct, an) {
  if (st.kind === 'ex') return;          // les ateliers enregistrent eux-mêmes
  const ex = S ? (S.kind === 'dictee' ? 'dictee' : 'serie') : 'serie';
  const base = { ex, s: S ? S.s : null, item: st.expected || st.expectedTxt || '', given, expected: st.expected || st.expectedTxt || '' };
  if (correct) track(Object.assign(base, { ok: true, tests: [{ cat: catOfStep(st), sub: null }] }));
  else { let errs = catsFromKeys((an && an.keys) || []); if (!errs.length) errs = [{ cat: catOfStep(st), sub: null }]; track(Object.assign(base, { ok: false, errs: uniq(errs.map(JSON.stringify)).map(JSON.parse) })); }
}

/* --- Niveau : séance jusqu'à laquelle on travaille --- */
function defaultLevel() { let m = 1; Object.keys(P.cards).forEach(sl => { if (cardDone(sl) && CARDS[sl]) m = Math.max(m, CARDS[sl].s); }); return m; }
const level = () => P.level || defaultLevel();
const marksFor = L => [F, K, D, FT, KT, DT].filter(m => (CHAR_S[m] || MARK_S[m] || 1) <= L);

/* --- Formes positionnelles --- */
function formStr(l, pos) {
  const j = joinsL(l);
  if (pos === 'iso') return l;
  if (pos === 'init') return j ? l + TW : l;
  if (pos === 'med') return j ? TW + l + TW : TW + l;
  return TW + l;
}
const posOf = l => joinsL(l) ? ['iso', 'init', 'med', 'fin'] : ['iso', 'fin'];
const POS_FR = { iso: 'seule', init: 'début de mot', med: 'milieu de mot', fin: 'fin de mot' };

/* --- Syllabes --- */
const syl = (l, v, long) => long ? l + v + LONG[v] : (v === FT && l !== 'ة' ? l + FT + 'ا' : l + v);
const sylTxt = o => translit(syl(o.l, o.v, o.long));

/* ---------- Générateurs de questions (toujours limités au niveau L) ---------- */
function qTrouve(L, target) {
  const P0 = pool(L); if (P0.length < 3) return null;
  const t = target && P0.includes(target) ? target : pick(P0);
  const conf = Object.values(ST().el).filter(e => (e.cat === 'proches' || e.cat === 'lettre') && e.sub && e.sub.split('/').includes(t)).map(e => e.sub.split('/').find(x => x !== t));
  let d = uniq([...closeOf(t).filter(x => P0.includes(x)), ...conf.filter(x => P0.includes(x))]);
  d = uniq([...d, ...shuffle(P0.filter(x => x !== t && !d.includes(x)))]).slice(0, Math.min(5, P0.length - 1));
  const pos = pick(['iso', 'init', 'med', 'fin']);
  return { kind: 'ex', type: 'trouve', s: L, title: EX_NAMES.trouve, target: t, pos, card: CARD_OF_CH[t],
    options: shuffle([t, ...d]).map(l => ({ l, ar: formStr(l, pos) })) };
}
function qMeme(L, target) {
  const P0 = pool(L); if (P0.length < 2) return null;
  const t = target && P0.includes(target) ? target : pick(P0);
  const good = posOf(t).map(p => ({ l: t, p, ar: formStr(t, p), ok: true }));
  let others = closeOf(t).filter(x => P0.includes(x));
  if (!others.length) others = shuffle(P0.filter(x => x !== t)).slice(0, 1);
  const bad = [];
  shuffle(others).slice(0, 2).forEach(o => shuffle(posOf(o)).slice(0, 2).forEach(p => bad.push({ l: o, p, ar: formStr(o, p), ok: false })));
  const opts = shuffle([...good, ...shuffle(bad).slice(0, Math.max(1, 6 - good.length))]);

}
/* focus : 'harakat' | 'prolongation' | 'lettre' | 'lecture' | { mark } */
function qSyll(L, opt = {}) {
  const P0 = pool(L), MK = marksFor(L), longOK = L >= 2;
  const l = opt.letter && P0.includes(opt.letter) ? opt.letter : pick(P0);
  let v = opt.mark && MK.includes(opt.mark) ? opt.mark : pick(opt.focus === 'prolongation' ? [F, K, D] : MK.filter(m => [F, K, D].includes(m) || Math.random() < .4));
  const long = [F, K, D].includes(v) && longOK && (opt.focus === 'prolongation' ? Math.random() < .6 : Math.random() < .3);
  const T = { l, v, long };
  const cands = [];
  const other = arr => arr.filter(x => x !== v);
  (v === FT || v === KT || v === DT ? other([FT, KT, DT].filter(m => MK.includes(m))) : other([F, K, D])).forEach(m => cands.push({ l, v: m, long, w: opt.focus === 'harakat' ? 3 : 2 }));
  if (longOK && [F, K, D].includes(v)) cands.push({ l, v, long: !long, w: opt.focus === 'prolongation' ? 4 : 2 });
  const near = closeOf(l).filter(x => P0.includes(x)), far = P0.filter(x => x !== l && !near.includes(x));
  const lx = near.length ? pick(near) : far.length ? pick(far) : null;
  if (lx) { cands.push({ l: lx, v, long, w: opt.focus === 'lettre' ? 4 : 2 }); cands.push({ l: lx, v: pick(v === FT || v === KT || v === DT ? [F, K, D] : other([F, K, D])), long, w: opt.focus === 'lecture' ? 3 : 1 }); }
  const seen = new Set([sylTxt(T)]), opts = [T];
  cands.sort((a, b) => b.w - a.w + (Math.random() - .5)).forEach(c => { const tx = sylTxt(c); if (opts.length < 4 && !seen.has(tx)) { seen.add(tx); opts.push(c); } });

function qEcris(L, target) {
  const P0 = pool(L); const t = target && P0.includes(target) ? target : pick(P0);

const GEN = { trouve: (L, x) => qTrouve(L, x), meme: (L, x) => qMeme(L, x), syll: (L, x) => qSyll(L, x || {}), ecoute: (L, x) => qSyll(L, Object.assign({ mode: 'ecoute' }, x || {})), ecris: (L, x) => qEcris(L, x) };
const exAvailable = (type, L) => (type === 'trouve' ? pool(L).length >= 3 : type === 'meme' ? pool(L).length >= 2 : true);

/* ---------- Séries ---------- */
function openAtelier(type) {
  const L = level();
  if (!exAvailable(type, L)) return toast('Disponible à partir de la séance 02');
  const steps = []; let guard = 0;
  while (steps.length < 8 && guard++ < 40) { const q = GEN[type](L); if (q) steps.push(q); }
  startSeries({ kind: 'atelier', ex: type, s: L, title: EX_NAMES[type], label: `Atelier · jusqu'à la séance ${pad(L)}`, steps, trk: {}, rebuild: () => openAtelier(type) });
}
/* Série sur mesure : les points à consolider pèsent plus lourd */
function weakList() {
  return Object.values(ST().el).filter(e => e.n > 0 && e.n > e.ok * .5).sort((a, b) => (b.n - b.ok * .5) - (a.n - a.ok * .5) || (b.last || '').localeCompare(a.last || ''));
}
function openTargeted() {
  const L = level(), steps = [], P0 = pool(L);
  const add = q => { if (q && steps.length < 10) steps.push(q); };
  weakList().slice(0, 6).forEach(e => {
    const [a, b] = (e.sub || '').split('/');
    for (let k = 0; k < 2; k++) {
      if (e.cat === 'proches' || e.cat === 'lettre') { const t = P0.includes(a) && P0.includes(b) ? pick([a, b]) : null; if (t) add(k ? qSyll(L, { letter: t, focus: 'lettre' }) : qTrouve(L, t)); }
      else if (e.cat === 'harakat') { const m = NAME2MARK[a] || NAME2MARK[e.sub]; add(qSyll(L, { mark: m, focus: 'harakat' })); }
      else if (e.cat === 'prolongation' && L >= 2) add(qSyll(L, { focus: 'prolongation', letter: CARD_OF_CH[e.item] ? e.item : null }));
      else if (e.cat === 'forme') add(qMeme(L, P0.includes(e.sub) ? e.sub : null));
      else if (e.cat === 'ecriture') add(qEcris(L, e.sub));
      else if (e.cat === 'lecture') add(qSyll(L, { focus: 'lecture' }));
    }
  });
  /* compléter avec les catégories les moins acquises */
  const cats = CAT_ORDER.filter(c => ST().cat[c]).sort((x, y) => (pctOf(ST().cat[x]) ?? 100) - (pctOf(ST().cat[y]) ?? 100));
  const byCat = { lettre: () => qTrouve(L), proches: () => qTrouve(L), forme: () => qMeme(L), harakat: () => qSyll(L, { focus: 'harakat' }), prolongation: () => L >= 2 ? qSyll(L, { focus: 'prolongation' }) : qSyll(L), lecture: () => qSyll(L, { focus: 'lecture' }), ecriture: () => qEcris(L), autre: () => qSyll(L) };
  let g = 0;
  while (steps.length < 10 && g++ < 60) { const c = cats.length ? cats[g % Math.min(3, cats.length)] : pick(['trouve', 'meme', 'syll']); add(byCat[c] ? byCat[c]() : GEN[c](L)); }
  startSeries({ kind: 'atelier', ex: 'cible', s: L, title: 'Ma série sur mesure', label: `Points à consolider · séance ${pad(L)}`, steps: shuffle(steps), trk: {}, rebuild: openTargeted });
}

}

/* ---------- Correction immédiate ---------- */

  const fb = $('#fb');
  if (ok) {
    fb.innerHTML = `<div class="fb-ok">${ICON.check}<span>${pick(['C\'est juste !', 'Bravo !', 'Très bien !', 'Parfait !'])}</span>${info.okNote ? `<small>${info.okNote}</small>` : ''}</div>`;
    fbTimer = setTimeout(next, info.okNote ? 1600 : 950);
    return;
  }
  if (first) {
    S.missed.push(st.target);
    const clone = Object.assign({}, st, { retry: true, options: st.options ? shuffle(st.options.map(o => Object.assign({}, o))) : undefined });
    S.steps.splice(Math.min(S.i + 3, S.steps.length), 0, clone);
  }

  fb.innerHTML = `<div class="remed" role="alert"><h3>Presque ! Regardons ensemble.</h3>
    ${info.cmp ? `<div class="cmp">${info.cmp}</div>` : ''}
    <ul class="msgs">${(info.msgs || []).map(m => `<li>${m}</li>`).join('')}</ul>
    <p class="ex-cat">Point à consolider : <b>${esc(uniq((info.errs || [{ cat }]).map(e => CATS[e.cat])).join(' · '))}</b></p>
    <div class="remed-actions">${st.card && CARDS[st.card] ? `<button class="btn soft" data-act="see-card" data-slug="${st.card}">Revoir ${CARDS[st.card].letter ? arHTML(CARDS[st.card].letter) : esc(CARDS[st.card].name)}</button>` : ''}</div>
    ${first ? '<p class="small muted">Cette question reviendra un peu plus loin.</p>' : ''}

}
const A1 = s => arHTML(s);
const cmpBox = (given, good) => `<div><p class="lbl">Ta réponse</p><div class="ex-cmp">${given}</div></div><div class="good"><p class="lbl">Bonne réponse</p><div class="ex-cmp">${good}</div></div>`;

  const tests = [{ cat: 'lecture', sub: null }, { cat: 'harakat', sub: HNAME[T.v] }, ...(T.long ? [{ cat: 'prolongation', sub: LONG[T.v] }] : []), ...st.options.filter(x => isClose(x.l, T.l)).map(x => ({ cat: 'proches', sub: pairKey(x.l, T.l) }))];

  else if (dv) { errs = [{ cat: 'harakat', sub: HNAME[T.v] }]; msgs.push(`Ici c'est une ${HNAME[T.v]} ${A1(TW + T.v)} : on lit « ${esc(sylTxt(T))} », pas « ${esc(o.txt)} ».`); }

    cmp: st.type === 'ecoute' ? cmpBox(A1(o.ar), A1(st.target)) : cmpBox(`<p class="txtans">« ${esc(o.txt)} »</p>`, `<p class="txtans">« ${esc(sylTxt(T))} »</p>`) });
}
function exMemeValidate() {
  const st = S.steps[S.i], sel = new Set($$('#main .ex-opt[aria-pressed="true"]').map(b => +b.dataset.i));
  if (!sel.size) return toast('Touche au moins une forme');
  const wrong = st.options.filter((o, i) => sel.has(i) && !o.ok), missed = st.options.filter((o, i) => !sel.has(i) && o.ok);
  $$('#main .ex-opt').forEach((b, i) => { const o = st.options[i]; b.classList.add(o.ok ? (sel.has(i) ? 'ok' : 'miss') : (sel.has(i) ? 'no' : 'dim')); });
  const ok = !wrong.length && !missed.length;
  const goodHTML = st.options.filter(o => o.ok).map(o => A1(o.ar)).join(' ');
  if (ok) return exResolve(st, true, { given: goodHTML, expected: st.target, tests: [{ cat: 'forme', sub: st.target }, ...uniq(st.options.filter(o => !o.ok).map(o => o.l)).filter(l => isClose(l, st.target)).map(l => ({ cat: 'proches', sub: pairKey(l, st.target) }))] });
  const errs = [], msgs = [];
  uniq(wrong.map(o => o.l)).forEach(l => { const c = isClose(l, st.target); errs.push({ cat: c ? 'proches' : 'lettre', sub: pairKey(l, st.target) }); msgs.push(`${wrong.filter(o => o.l === l).map(o => A1(o.ar)).join(' ')} : c'est la lettre ${A1(l)}, pas ${A1(st.target)}${c && DOTS[l] ? ` (${DOTS[l]})` : ''}.`); });
  if (missed.length) { errs.push({ cat: 'forme', sub: st.target }); msgs.push(`Il manquait ${missed.map(o => `${A1(o.ar)} (${POS_FR[o.p]})`).join(', ')} : c'est bien ${A1(st.target)}, sa forme change selon sa place dans le mot.`); }
  exResolve(st, false, { given: st.options.filter((o, i) => sel.has(i)).map(o => o.ar).join(' '), expected: st.options.filter(o => o.ok).map(o => o.ar).join(' '), errs, msgs,
    cmp: cmpBox(st.options.filter((o, i) => sel.has(i)).map(o => A1(o.ar)).join(' '), goodHTML) });
}

/* ---------- Zone d'écriture ---------- */
let DRAW = null;
function initDraw(st) {
  const cv = $('#drawCv'); if (!cv) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1), box = cv.parentNode;
  cv.width = box.clientWidth * dpr; cv.height = box.clientHeight * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = '#4A3426';
  DRAW = { cv, ctx, st, strokes: st.strokes = [], cur: null };
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top, Date.now()]; };
  cv.addEventListener('pointerdown', e => { if (DRAW.locked) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); DRAW.cur = [pt(e)]; DRAW.strokes.push(DRAW.cur); const [x, y] = DRAW.cur[0]; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = '#4A3426'; ctx.fill(); $('#drawHint').style.opacity = 0; });
  cv.addEventListener('pointermove', e => {
    if (!DRAW.cur) return; e.preventDefault();
    const p = pt(e), a = DRAW.cur[DRAW.cur.length - 1]; DRAW.cur.push(p);
    const b = DRAW.cur[DRAW.cur.length - 3] || a;
    ctx.beginPath(); ctx.moveTo((b[0] + a[0]) / 2, (b[1] + a[1]) / 2); ctx.quadraticCurveTo(a[0], a[1], (a[0] + p[0]) / 2, (a[1] + p[1]) / 2); ctx.stroke();
  });
  const end = () => { DRAW.cur = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
function drawClear() { if (!DRAW || DRAW.locked) return; const { cv, ctx } = DRAW; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); DRAW.strokes.length = 0; $('#drawHint').style.opacity = 1; }
function drawReveal(fromValidate) {
  const st = S.steps[S.i]; DRAW.locked = true;
  const img = DRAW.strokes.length ? `<img class="ex-draw-img" src="${DRAW.cv.toDataURL('image/png')}" alt="ton tracé">` : '<p class="txtans">—</p>';
  $$('#drawBtns button').forEach(b => b.disabled = true);
  const forms = posOf(st.target).map(p => A1(formStr(st.target, p))).join(' ');
  $('#fb').innerHTML = `<div class="ex-self"><div class="cmp">${cmpBox(img, `<span class="onl">${A1(st.target)}</span>`)}</div>
    <p class="muted small center">Ses formes : ${forms}</p>
    ${fromValidate ? `<p class="prompt center">As-tu bien écrit la lettre ?</p><div class="selfeval on"><button class="btn soft" data-act="draw-self" data-v="0">Pas encore</button><button class="btn primary" data-act="draw-self" data-v="1">Oui, c'est juste</button></div>`
      : `<button class="btn primary block" data-act="draw-self" data-v="-1">Continuer</button>`}</div>`;
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
async function drawValidate() {
  if (!DRAW || !DRAW.strokes.length) return toast('Écris d\'abord la lettre');
  if (Recognizer.ready) { const r = await Recognizer.recognize(DRAW.strokes, DRAW.st.target); if (r) { $('#fb').innerHTML = ''; return drawSelf(r === DRAW.st.target ? 1 : 0, r); } }
  drawReveal(true);
}
function drawSelf(v, recognized) {
  const st = S.steps[S.i], ok = v === 1;
  $('#fb').innerHTML = '<div></div>';
  exResolve(st, ok, ok ? { given: recognized || '(tracé)', expected: st.target, tests: [{ cat: 'ecriture', sub: st.target }] }
    : { given: v === -1 ? '(réponse vue)' : recognized || '(tracé)', expected: st.target, errs: [{ cat: 'ecriture', sub: st.target }],
      msgs: [`Recopie ${A1(st.target)} deux ou trois fois sur une feuille en regardant le modèle${DOTS[st.target] ? ` : ${DOTS[st.target]}` : ''}.`] });
}

/* ---------- Profil « points à consolider » (onglet Révisions) ---------- */
function elLabel(e) {
  if (e.cat === 'proches' || e.cat === 'lettre') { const [a, b] = e.sub.split('/'); return b ? `${A1(a)} <span class="muted">↔</span> ${A1(b)}` : A1(a); }
  if (e.cat === 'harakat') { const m = NAME2MARK[e.sub]; return m ? `${A1(TW + m)} <span class="muted">${esc(e.sub)}</span>` : esc(e.sub.replace('/', ' ↔ ')); }
  if (e.cat === 'prolongation') return e.sub === 'prolongation' ? 'son long / court' : `${A1(e.sub)} <span class="muted">son long</span>`;
  if (e.cat === 'forme' || e.cat === 'ecriture') return A1(e.sub);
  return esc(e.sub || '');
}
function profileHTML() {
  const st = ST(), L = level();
  const rows = CAT_ORDER.filter(c => c !== 'autre' || st.cat.autre).map(c => {
    const p = pctOf(st.cat[c]), n = st.cat[c] ? st.cat[c].ok + st.cat[c].err : 0;
    return `<div class="pf-row${p == null ? ' none' : ''}"><div class="pf-t"><span>${CATS[c]}</span><b>${p == null ? '—' : p + ' % acquis'}</b></div>
      <div class="pf-bar"><span data-w="${p || 0}" class="${p == null ? '' : p >= 75 ? 'hi' : p >= 50 ? 'mid' : 'lo'}"></span></div>${p != null ? `<small>${n} réponse${n > 1 ? 's' : ''}</small>` : ''}</div>`;
  }).join('');
  const weak = weakList();
  const groups = ['proches', 'lettre', 'harakat', 'prolongation', 'forme', 'ecriture', 'lecture'].map(c => [c, weak.filter(e => e.cat === c && e.sub).slice(0, 3)]).filter(([, a]) => a.length);
  const any = Object.keys(st.cat).length;
  return `<section class="pf rv" id="profil">
    <p class="lbl">Mon profil</p><h2 class="pf-h">Mes points à consolider</h2><hr class="rule">
    ${any ? `<div class="pf-rows">${rows}</div>` : '<p class="muted">Fais un atelier ou une série : tes points forts et tes points à consolider apparaîtront ici.</p>'}
    ${groups.length ? `<div class="pf-weak">${groups.map(([c, a]) => `<p class="lbl">${({ proches: 'Lettres qui se ressemblent', lettre: 'Lettres à bien reconnaître', harakat: 'Harakat à renforcer', prolongation: 'Prolongations à renforcer', forme: 'Formes à revoir', ecriture: 'Lettres à écrire encore', lecture: 'Lecture' })[c]}</p>
      <ul>${a.map(e => `<li><span class="pf-el">${elLabel(e)}</span><span class="pf-n">${e.n} fois à revoir${e.ok ? ` · ${e.ok} réussite${e.ok > 1 ? 's' : ''}` : ''}</span></li>`).join('')}</ul>`).join('')}</div>` : ''}
    <button class="btn primary block" data-act="targeted" ${any ? '' : 'disabled'}>Revoir mes points à consolider</button>
  </section>`;
}
function ateliersHTML() {
  const L = level();
  const T = [['trouve', 'Trouve la lettre', 'Repère la bonne lettre parmi ses sosies', 'ب'], ['meme', 'Même lettre', 'Toutes ses formes : début, milieu, fin', 'ـبـ'],
    ['syll', 'Lis la syllabe', 'Lettre + haraka, sons courts et longs', 'بَا'], ['ecoute', 'Écoute et choisis', 'Relie le son à l\'écrit', "<svg viewBox=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9v6h4l5 4V5L8 9H4z\"/><path d=\"M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12\"/></svg>"], ['ecris', 'Écris la lettre', 'Trace-la avec ton doigt', "<svg viewBox=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20c3-1 5-4 8-4s3 3 6 2\"/><path d=\"M14 4l4 4-7 7H7v-4z\"/></svg>"]];
  return `<section class="at rv"><p class="lbl">S'entraîner</p><h2 class="pf-h">Ateliers</h2><hr class="rule">
    <div class="lvl"><span>Jusqu'à la séance</span><div class="lvl-c">${[1, 2, 3, 4, 5, 6, 7, 8].map(s => `<button class="${s === L ? 'on' : ''}" data-act="level" data-s="${s}">${pad(s)}</button>`).join('')}</div></div>
    <div class="at-grid">${T.map(([k, n, d, g], i) => { const off = !exAvailable(k, L); return `<button class="at-card${off ? ' off' : ''}" style="--i:${i}" data-act="atelier" data-ex="${k}">
      <span class="at-g">${/[\u0600-\u06FF]/.test(g) ? A1(g) : g}</span><span class="at-n">${n}</span><span class="at-d">${off ? 'à partir de la séance 02' : d}</span>${k === 'ecoute' || k === 'ecris' ? '<span class="at-soon">audio bientôt</span>' : ''}</button>`; }).join('')}</div>
  </section>`;
}
function animateProfile() {
  setTimeout(() => $$('.pf-bar span').forEach(s => s.style.width = s.dataset.w + '%'), 350);
}

/* ---------- Bilan de fin de série ---------- */
function bilanHTML() {
  if (!S || !S.trk) return '';
  const c = CAT_ORDER.filter(k => S.trk[k]).map(k => [k, pctOf(S.trk[k])]);
  if (!c.length) return '';
  const good = c.filter(([, p]) => p >= 75), work = c.filter(([, p]) => p < 75);
  const li = arr => arr.map(([k, p]) => `<li><span>${CATS[k]}</span><b>${p} %</b></li>`).join('');
  return `<div class="bilan">${good.length ? `<p class="lbl">Ce que tu maîtrises</p><ul class="bl ok">${li(good)}</ul>` : ''}
    ${work.length ? `<p class="lbl">À consolider</p><ul class="bl work">${li(work)}</ul>` : ''}
    <button class="btn primary block" data-act="targeted">Revoir mes points à consolider</button></div>`;
}
function consolidationLine() {
  const st = ST(), parts = CAT_ORDER.filter(c => st.cat[c]).map(c => `${CATS[c]} ${pctOf(st.cat[c])} %`);
  const w = weakList().filter(e => e.cat === 'proches' || e.cat === 'lettre').slice(0, 3).map(e => e.sub.replace('/', '/'));
  return parts.length ? `\nMes acquis : ${parts.join(', ')}${w.length ? `\nÀ consolider : ${w.join(', ')}` : ''}` : '';
}

Object.assign(ACT, {
  atelier: el => openAtelier(el.dataset.ex),
  targeted: () => openTargeted(),
  level: el => { P.level = +el.dataset.s; saveP(); renderHome(); const a = $('.at'); if (a) a.scrollIntoView({ block: 'start' }); },
  'ex-pick': el => exPick(el),
  'ex-toggle': el => { const on = el.getAttribute('aria-pressed') !== 'true'; el.setAttribute('aria-pressed', on); el.classList.toggle('sel', on); },
  'ex-meme-ok': () => exMemeValidate(),
  'draw-clear': () => drawClear(),
  'draw-show': () => drawReveal(false),
  'draw-ok': () => drawValidate(),
  'draw-self': el => drawSelf(+el.dataset.v),
  'api-play': async () => { const st = S && S.steps[S.i]; const u = st && await AudioAPI.url({ ar: st.target, s: st.s }); if (u) new Audio(u).play().catch(() => {}); }
});

boot();
