*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 120px calc(18px + env(safe-area-inset-left))}
.hidden{display:none!important}

/* ---------- Arabe : calques superposés (couleur des harakat sans casser la liaison) ---------- */
.ar{position:relative;display:inline-block;font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;white-space:nowrap;line-height:1.9;font-weight:400;vertical-align:middle}
.ar>.lay{position:absolute;inset:0;pointer-events:none;white-space:nowrap}
.ar>.lay-a{color:var(--ha)}
.ar>.lay-i{color:var(--hi)}
.ar>.lay-u{color:var(--hu)}
.ar>.lay-top{position:relative}
.ar .hl{color:var(--accent)}
.ar>.lay .hl{color:inherit}
.ar .bad{color:var(--accent)}
.ar>.lay .bad{color:inherit}
.ar .fa{color:var(--ha)}
.ar>.lay .fa{color:inherit}

/* ---------- Typo ---------- */
.lbl{font-family:var(--f-lbl);color:var(--ink2);font-size:14px;margin:0}
.page-title{font-family:var(--f-sans);font-weight:300;text-transform:uppercase;letter-spacing:.16em;font-size:19px;margin:6px 0 4px}
.rule{height:1px;background:var(--line);margin:10px 0 18px;border:0}
.muted{color:var(--ink2)}
.small{font-size:14px}

/* ---------- Accueil ---------- */
.hero{padding:18px 0 8px}
.hero-title{font-family:var(--f-round);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.02;margin:6px 0 14px;letter-spacing:-.005em}
.hello{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:18px}
.hello strong{font-weight:600}
.link{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:36px}
.prog{margin:18px 0 14px}
.bar{height:6px;border-radius:6px;background:var(--card);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .5s}
.prog p{margin:8px 0 0;font-size:14px;color:var(--ink2)}

.session{margin:38px 0 10px}
.s-head{display:flex;align-items:flex-end;gap:12px}
.s-num{font-family:var(--f-display);font-size:68px;line-height:.9;font-weight:400}
.s-lbl{font-family:var(--f-lbl);font-size:16px;color:var(--ink2);padding-bottom:6px}
.s-glyphs{margin-left:auto;font-family:var(--f-ar);font-size:22px;color:var(--ink2);direction:rtl;padding-bottom:2px}
.s-meta{font-size:13px;color:var(--ink2);margin:-8px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.lcard{position:relative;background:var(--card);border-radius:var(--r);padding:12px 6px 12px;min-height:134px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.lcard:active{transform:scale(.97)}
.lcard .ar{font-size:50px;line-height:1.55}
.lcard-name{font-family:var(--f-lbl);font-size:15px;margin-top:2px}
.lcard-hint{font-size:11.5px;color:var(--ink2);line-height:1.25;margin-top:2px;padding:0 4px}
.lcard.notion{background:transparent;border:1px solid var(--line);box-shadow:none}
.lcard .done{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.s-actions{margin-top:14px}
.foot{margin:48px 0 10px;text-align:center}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:14px;padding:0 20px;font-weight:500;font-size:16px;transition:background .2s,transform .12s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--card)}
.btn.ghost{border:1px solid var(--line)}
.btn.block{display:flex;width:100%}
.btn.wa{background:#25D366;color:#10301c}
.btn:disabled{opacity:.45}
.btn-audio{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:15px}
.btn-audio svg{width:18px;height:18px}
.btn-audio.big{min-height:64px;padding:0 28px;font-size:18px;background:var(--ink);color:var(--bg);border:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- Navigation ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(242,238,235,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20}
.nav button{flex:0 1 200px;min-height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);gap:2px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink);background:var(--card)}

/* ---------- Série ---------- */
.s-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.s-top .x{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);flex:none}
.s-top .x svg{width:18px;height:18px}
.s-top .bar{flex:1}
.s-count{font-size:13px;color:var(--ink2);min-width:42px;text-align:right}
.step-lbl{font-family:var(--f-lbl);color:var(--ink2);font-size:15px;margin:14px 0 2px}
.step-title{font-family:var(--f-sans);font-weight:300;text-transform:uppercase;letter-spacing:.14em;font-size:17px;margin:0 0 4px}
.prompt{font-size:19px;margin:12px 0 14px;line-height:1.4}
.prompt b{font-weight:600}
.center{text-align:center}

.onl{display:inline-block;border-bottom:3px solid var(--accent);padding:0 .35em;line-height:1.35}
.big .ar{font-size:clamp(84px,30vw,128px);line-height:1.6}
.word .ar{font-size:clamp(46px,15vw,72px);line-height:1.9}

.flip{perspective:1200px;height:min(56vh,390px);margin:10px 0 14px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r-lg);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;box-shadow:var(--shadow);text-align:center;overflow:hidden}
.face.back{transform:rotateY(180deg);background:var(--paper);border:1px solid var(--line)}
.face .tag{position:absolute;top:16px;left:18px;font-family:var(--f-lbl);font-size:13px;color:var(--ink2)}
.face .tag-r{position:absolute;top:14px;right:16px}
.face .hint{position:absolute;bottom:16px;font-size:13px;color:var(--ink2)}
.phon{font-family:var(--f-sans);font-size:clamp(30px,9vw,44px);font-weight:300;letter-spacing:.02em;margin:4px 0 6px}
.sens{font-family:var(--f-lbl);color:var(--ink2);margin:0 0 16px;font-size:16px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:3px 10px;background:var(--card);color:var(--ink)}
.badge.inv{background:#F4E3C9}
.badge.warn{background:var(--badbg);color:#8a1a12}
.badge.ok{background:var(--okbg);color:#20492c}
.selfeval{display:grid;grid-template-columns:1fr 1fr;gap:10px;visibility:hidden;opacity:0;transition:opacity .3s}
.selfeval.on{visibility:visible;opacity:1}

.forms3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.fcard{background:var(--card);border-radius:var(--r);padding:10px 4px 6px;text-align:center}
.fcard .ar{font-size:44px;line-height:1.7;color:var(--ink)}
.fcard .ar .hl{color:var(--accent)}
.note{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:15px;margin:12px 0}
.examples{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.ex{background:var(--card);border-radius:var(--r);padding:6px 16px;text-align:center;min-width:92px}
.ex .ar{font-size:40px}
.ex small{display:block;color:var(--ink2);font-size:13px;margin-top:-4px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin:10px 0}
.opt{background:var(--card);border-radius:var(--r);min-height:96px;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:var(--shadow);transition:background .2s,transform .12s;border:2px solid transparent}
.opt:active{transform:scale(.97)}
.opt .ar{font-size:48px}
.opt.txt{font-size:17px;min-height:64px}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--accent)}
.opt:disabled{cursor:default}
.display{text-align:center;margin:6px 0 12px}

/* ---------- Tuiles ---------- */
.ans{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);min-height:104px;display:flex;align-items:center;justify-content:center;padding:4px 14px;margin:8px 0 12px;overflow-x:auto}
.ans .ar{font-size:clamp(46px,14vw,64px)}
.ans .ph{color:var(--ink2);font-size:15px}
.kb{background:var(--card);border-radius:var(--r);padding:10px}
.kb-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;direction:rtl}
.kb-row+.kb-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.tile{height:52px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(74,52,38,.12)}
.tile .ar{font-size:28px;line-height:1.9}
.tile.sign{background:var(--bg)}
.tile.sign .ar{font-size:32px}
.tile:active{transform:scale(.94);background:#fff}
.kb-ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.kb-ctrl button{min-height:46px;border-radius:10px;background:var(--bg);font-size:13.5px;line-height:1.2;padding:4px}

/* ---------- Correction / remédiation ---------- */
.fb-ok{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--okbg);color:#20492c;border-radius:var(--r);padding:14px;margin:14px 0;font-weight:500}
.remed{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0}
.remed h3{font-family:var(--f-lbl);font-weight:400;font-size:18px;margin:0 0 12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--card);border-radius:var(--r-sm);padding:8px;text-align:center;min-width:0}
.cmp>div.good{background:var(--okbg)}
.cmp .ar{font-size:clamp(30px,10vw,44px)}
.cmp .txtans{font-size:17px;padding:12px 0}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:4px;direction:rtl}
.strip .cl{background:var(--paper);border-radius:8px;padding:0 6px;min-width:30px;border:1px solid transparent}
.strip .cl .ar{font-size:26px;line-height:1.8}
.strip .cl.bad{background:#FBD0C9;border-color:var(--accent)}
.strip .sp{width:10px}
.msgs{margin:14px 0 10px;padding:0;list-style:none}
.msgs li{padding:6px 0 6px 18px;position:relative;font-size:16.5px}
.msgs li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.msgs .ar{font-size:26px;line-height:1.3}
.remed-actions{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.remed-actions .btn{min-height:46px;font-size:15px;padding:0 14px}

.mini-intro{background:var(--card);border-radius:var(--r-lg);padding:24px;text-align:center;margin:20px 0}
.result{text-align:center;padding:10px 0}
.score{font-family:var(--f-display);font-size:92px;line-height:1;margin:12px 0 0}
.score small{font-size:40px;color:var(--ink2)}
.result ul{list-style:none;padding:0;margin:8px 0}
.result li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 16px}
.chip{background:var(--card);border-radius:999px;padding:2px 14px;font-size:15px}
.chip .ar{font-size:24px;line-height:1.7}

/* ---------- Dictées ---------- */
.dlist{display:flex;flex-direction:column;gap:10px}
.ditem{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:var(--r);padding:14px 16px;min-height:64px;text-align:left;width:100%}
.ditem b{font-weight:500}
.empty{font-size:14px;color:var(--ink2);padding:6px 0}

/* ---------- Modale & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(74,52,38,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(74,52,38,.2);animation:up .28s cubic-bezier(.2,.75,.2,1)}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:24px}}
.modal h2{font-family:var(--f-sans);font-weight:300;text-transform:uppercase;letter-spacing:.14em;font-size:17px;margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-family:var(--f-lbl);color:var(--ink2);font-size:14px}
.field input,.field select,.field textarea{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:10px 14px;font-size:17px;width:100%}
.field input.arin{font-family:var(--f-ar);font-size:30px;direction:rtl;text-align:right;min-height:64px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;z-index:60;max-width:88vw;text-align:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- Admin ---------- */
.adm details{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden}
.adm summary{list-style:none;padding:16px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:56px}
.adm summary::-webkit-details-marker{display:none}
.adm summary::after{content:"+";font-size:22px;color:var(--ink2);font-weight:300}
.adm details[open] summary::after{content:"–"}
.adm .inner{padding:0 16px 16px}
.adm-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm-filters select{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:15px}
.ilist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:6px 10px}
.irow .ar{font-size:30px;line-height:1.7}
.irow .meta{font-size:13px;line-height:1.35;min-width:0;overflow:hidden}
.irow .meta b{font-weight:500;font-size:14.5px}
.irow .acts{display:flex;gap:4px}
.irow .acts button{width:40px;height:40px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.irow .acts svg{width:16px;height:16px}
.irow.issue{outline:2px solid var(--accent)}
.report{font-size:14px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;max-height:260px;overflow:auto;white-space:pre-wrap}
.warnbox{background:var(--badbg);color:#6e1710;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.okbox{background:var(--okbg);color:#20492c;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.preview{text-align:center;background:var(--card);border-radius:12px;min-height:70px;display:flex;align-items:center;justify-content:center}
.preview .ar{font-size:42px}
.rec-on{background:var(--accent)!important;color:#fff!important}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v2 : sous-titre, installation, confort tactile en mode application */
.hero-by{font-family:var(--f-lbl);color:var(--ink2);font-size:15px;margin:-8px 0 14px;letter-spacing:.02em}
.install{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.install p{margin:4px 0 8px;font-size:15px}
.install .lbl{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.btn,.lcard,.opt,.tile,.flip-in{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.standalone body{overscroll-behavior-y:none}

/* Banneau de mise à jour disponible */
.update-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--badbg);color:#8a1a12;border-radius:var(--r);padding:10px 14px;margin-top:12px;font-size:15px}
.update-banner .link{color:#8a1a12;font-weight:500;white-space:nowrap}

/* Onglet Lecture */
.lectures{display:flex;flex-direction:column;gap:12px;padding:0 0 20px}
.lec-card{background:var(--card);border-radius:var(--r);padding:18px 16px 16px;box-shadow:var(--shadow)}
.lec-head{display:flex;align-items:baseline;gap:10px}
.lec-num{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--ink)}
.lec-lbl{font-family:var(--f-lbl);font-size:15px;color:var(--ink2)}
.lec-list{list-style:none;margin:12px 0 16px;padding:0;direction:rtl;border-top:1px solid rgba(74,52,38,.15)}
.lec-list li{display:flex;align-items:center;gap:14px;padding:8px 2px;border-bottom:1px solid rgba(74,52,38,.1)}
.lec-list .n{font-family:var(--f-sans);font-size:14px;color:var(--ink2);min-width:22px;direction:ltr}
.lec-list .w{font-size:32px;color:var(--ink)}
.lec-w{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0}
.lec-fr{margin:0;direction:ltr;align-self:stretch;text-align:right;font-family:var(--f-lbl);font-size:15px;color:var(--ink2);font-style:italic;line-height:1.3}
.lec-card .btn{min-height:48px;font-size:15px;text-decoration:none;text-align:center}


/* =====================================================================
   ONGLET TAJWÎD (styles isolés sous .tj)
   ===================================================================== */
.tj{--tj-o:#F59E0B;--tj-p:#FF4FA3;--tj-d:#A0166E;--tj-g:#16A34A;--tj-s:#A8A29E;--tj-q:#22A7F0;--tj-e:#1E4FD8;--night:#1E140E;--night2:#2E2018;--cream:#F7EFE6;position:relative}
.tj *{box-sizing:border-box}
.tj .k-o{color:var(--tj-o)}.tj .k-p{color:var(--tj-p)}.tj .k-d{color:var(--tj-d)}.tj .k-g{color:var(--tj-g)}.tj .k-s{color:var(--tj-s)}.tj .k-q{color:var(--tj-q)}.tj .k-e{color:var(--tj-e)}
.tj .k-k{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(74,52,38,.4);text-decoration-thickness:2px;text-underline-offset:12px}
.tj .k-u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:10px;color:var(--ink)}
.tj-ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:2.1;display:inline}
.tj p .tj-ar,.tj .m .tj-ar,.tj .tj-pill .tj-ar,.tj .fb .tj-ar{font-size:1.45em;line-height:1.2;vertical-align:-.08em}
.tj .tj-pill .tj-ar{font-size:1.25em}
.tj-rule{display:flex;flex-direction:column}
.tj-rule .ex{margin-top:auto!important}
.tj-prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:40;background:linear-gradient(90deg,var(--tj-g),var(--tj-q),var(--tj-p),var(--tj-o));box-shadow:0 0 10px rgba(255,79,163,.5);transition:width .1s linear;pointer-events:none}

/* --- Héros nocturne --- */
.tj-hero{position:relative;overflow:hidden;margin:calc(-22px - env(safe-area-inset-top)) calc(-18px - env(safe-area-inset-right)) 0 calc(-18px - env(safe-area-inset-left));padding:calc(46px + env(safe-area-inset-top)) 24px 38px;min-height:560px;color:var(--cream);background:radial-gradient(120% 80% at 50% 0%,#3B2A1F 0%,var(--night) 60%);border-radius:0 0 34px 34px;isolation:isolate;touch-action:manipulation;cursor:pointer}
@media (min-width:600px){.tj-hero{border-radius:0 0 34px 34px}}
.tj-orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;z-index:-2;animation:tjOrb 14s ease-in-out infinite alternate}
.tj-orb.a{width:220px;height:220px;background:var(--tj-g);top:-40px;left:-60px}
.tj-orb.b{width:260px;height:260px;background:var(--tj-p);bottom:40px;right:-90px;animation-duration:18s;opacity:.4}
.tj-orb.c{width:180px;height:180px;background:var(--tj-q);bottom:-40px;left:20%;animation-duration:16s;opacity:.35}
.tj-orb.d{width:140px;height:140px;background:var(--tj-o);top:30%;right:10%;animation-duration:12s;opacity:.35}
@keyframes tjOrb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,40px) scale(1.15)}100%{transform:translate(-20px,10px) scale(.9)}}
.tj-cv{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.tj-hero .eyebrow{font-family:var(--f-lbl);font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin:0}
.tj-hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,13vw,68px);line-height:.95;margin:10px 0 0;letter-spacing:.02em}
.tj-hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--tj-o),var(--tj-p),var(--tj-q),var(--tj-g),var(--tj-o));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tjShine 6s linear infinite}
@keyframes tjShine{to{background-position:300% 0}}
.tj-draw{display:block;width:100%;height:auto;margin:18px 0 6px;overflow:visible}
.tj-draw text{font-family:var(--f-ar);font-size:120px;fill:rgba(247,239,230,0);stroke:url(#tjGrad);stroke-width:1.4;stroke-dasharray:900;stroke-dashoffset:900;animation:tjDraw 3.2s cubic-bezier(.6,.1,.2,1) .3s forwards,tjFill 1.2s ease 3.1s forwards}
@keyframes tjDraw{to{stroke-dashoffset:0}}
@keyframes tjFill{to{fill:rgba(247,239,230,.96);stroke-width:.4}}
.tj-hero .lead{font-size:17px;line-height:1.55;opacity:.88;margin:0;max-width:30em}
.tj-hero .tap{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-size:13px;opacity:.6}
.tj-hero .tap i{width:8px;height:8px;border-radius:50%;background:var(--tj-p);box-shadow:0 0 0 0 rgba(255,79,163,.6);animation:tjPing 1.8s infinite}
@keyframes tjPing{70%{box-shadow:0 0 0 12px rgba(255,79,163,0)}100%{box-shadow:0 0 0 0 rgba(255,79,163,0)}}
.tj-scroll{position:absolute;left:50%;bottom:16px;width:22px;height:36px;margin-left:-11px;border:1.5px solid rgba(247,239,230,.45);border-radius:12px}
.tj-scroll::after{content:'';position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--cream);animation:tjWheel 1.6s infinite}
@keyframes tjWheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* --- Sommaire collant --- */
.tj-toc{position:sticky;top:0;z-index:15;margin:0 -18px;padding:12px 18px 10px;background:rgba(242,238,235,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tj-toc::-webkit-scrollbar{display:none}
.tj-toc button{flex:0 0 auto;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--card);font-size:14px;color:var(--ink2);transition:background .3s,color .3s,transform .3s}
.tj-toc button b{font-family:var(--f-display);font-weight:400;margin-right:6px;color:var(--ink)}
.tj-toc button.on{background:var(--ink);color:var(--cream)}
.tj-toc button.on b{color:var(--tj-o)}

/* --- Sections --- */
.tj-sec{padding:46px 0 10px;scroll-margin-top:64px}
.tj-sh{display:flex;align-items:baseline;gap:14px}
.tj-sh .n{font-family:var(--f-display);font-size:64px;line-height:.9;background:linear-gradient(160deg,var(--ink) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.tj-sh h2{margin:0;font-family:var(--f-sans);font-weight:300;text-transform:uppercase;letter-spacing:.08em;font-size:21px;line-height:1.2}
.tj-sh h2 small{display:block;font-family:var(--f-lbl);text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink2);margin-top:4px}
.tj-sec>hr{border:0;height:1px;background:var(--line);margin:14px 0 18px}
.tj p.tx{margin:0 0 14px;color:var(--ink);font-size:16px}
.tj p.tx.soft{color:var(--ink2)}
.tj-card{background:var(--paper);border-radius:var(--r-lg);padding:20px 18px;box-shadow:var(--shadow);margin:0 0 14px;position:relative;overflow:hidden}
.tj-verse{text-align:center;font-size:30px;margin:6px 0 4px}
.tj-verse+.tr{text-align:center;font-family:var(--f-lbl);font-style:italic;color:var(--ink2);font-size:15px;margin:0}
.tj-ref{display:block;text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:8px}
.tj-pill{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--card);color:var(--ink2)}

/* Apparition au défilement */
.tj-rv{opacity:0;transform:translateY(28px) scale(.98);filter:blur(6px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1),filter .8s}
.tj-rv.in{opacity:1;transform:none;filter:none}

/* --- 4 façons de lier --- */
.tj-ways{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tj-ways button{min-height:52px;border-radius:14px;background:var(--card);font-size:14px;line-height:1.25;padding:8px 10px;transition:all .35s}
.tj-ways button.on{background:var(--ink);color:var(--cream);transform:translateY(-2px);box-shadow:0 10px 24px rgba(74,52,38,.25)}
.tj-chain{display:flex;flex-direction:column;align-items:stretch}
.tj-node{border-radius:18px;padding:14px 14px 10px;background:var(--bg);text-align:center;transition:background .4s,box-shadow .4s,transform .4s}
.tj-node .l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tj-node .tj-ar{font-size:24px}
.tj-node.live{background:#fff;box-shadow:0 0 0 2px var(--tj-o),0 12px 30px rgba(245,158,11,.25);transform:scale(1.02)}
.tj-joint{position:relative;height:58px;display:flex;align-items:center;justify-content:center}
.tj-joint .line{position:absolute;left:50%;top:4px;bottom:4px;width:4px;margin-left:-2px;border-radius:2px}
.tj-joint.wasl .line{background:linear-gradient(180deg,var(--tj-g),var(--tj-q),var(--tj-g));background-size:100% 200%;animation:tjFlow 1.2s linear infinite}
@keyframes tjFlow{to{background-position:0 -200%}}
.tj-joint.qat .line{background:repeating-linear-gradient(180deg,var(--accent) 0 6px,transparent 6px 12px);opacity:.6}
.tj-joint .lab{position:relative;z-index:1;background:var(--paper);padding:4px 12px;border-radius:999px;font-size:13px;box-shadow:0 2px 8px rgba(74,52,38,.1)}
.tj-joint.wasl .lab{color:var(--tj-g)}
.tj-joint.qat .lab{color:var(--accent)}
.tj-joint.breath .lab{animation:tjBreath .9s ease-in-out}
@keyframes tjBreath{50%{transform:scale(1.25);box-shadow:0 0 0 10px rgba(217,43,31,.12)}}
.tj-name{text-align:center;margin:12px 0 0;font-size:22px}

/* --- Code couleur --- */
.tj-codes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tj-code{position:relative;text-align:left;background:var(--paper);border-radius:20px;padding:14px 14px 12px;box-shadow:var(--shadow);min-height:150px;overflow:hidden;transition:transform .25s}
.tj-code:active{transform:scale(.97)}
.tj-code{display:flex;flex-direction:column;align-items:stretch}
.tj-code .dot{display:block;flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),0 0 16px var(--c)}
.tj-code .t{display:block;font-weight:500;margin-top:10px;font-size:15px;line-height:1.25}
.tj-code .d{display:block;font-size:13px;color:var(--ink2);line-height:1.35;margin-top:3px}
.tj-code .ex{background:none;padding:0;border-radius:0;min-width:0;margin-top:auto!important;display:block;text-align:center;font-size:30px;margin-top:6px}
.tj-code::before{content:'';position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.09;transition:transform .6s}
.tj-code.go::before{transform:scale(4)}
.tj-code.go .ex .fx{display:inline-block;animation:var(--fx) 1s ease}
.tj-code.wide{grid-column:1/-1;min-height:0}
@keyframes fxPulse{30%{transform:scale(1.35);filter:drop-shadow(0 0 8px currentColor)}}
@keyframes fxFade{40%,60%{opacity:.08}}
@keyframes fxBounce{20%{transform:translateY(-14px)}40%{transform:translateY(0)}55%{transform:translateY(-6px)}70%{transform:translateY(0)}}
@keyframes fxThump{25%{transform:scale(1.3) translateY(3px);text-shadow:0 6px 0 rgba(30,79,216,.25)}}

/* --- Durées (métronome) --- */
.tj-mad{display:flex;flex-direction:column;gap:10px}
.tj-madrow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;text-align:left;background:var(--paper);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.tj-madrow .k{font-weight:500;font-size:14px;line-height:1.2}
.tj-madrow .k small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.tj-bar{position:relative;height:34px;border-radius:12px;background:var(--bg);overflow:hidden}
.tj-bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);border-radius:12px;opacity:.9}
.tj-bar .beats{position:absolute;inset:0;display:flex}
.tj-bar .beats i{flex:1;border-right:1.5px dashed rgba(74,52,38,.15);position:relative}
.tj-bar .beats i:last-child{border-right:0}
.tj-bar .beats i.on::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;animation:tjBeat .4s ease}
@keyframes tjBeat{0%{transform:scale(0)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
.tj-note{font-size:13px;color:var(--ink2);text-align:center;margin:10px 0 0}

/* --- Nûn sâkina : cartes règles --- */
.tj-rules{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:6px 18px 18px;scrollbar-width:none}
.tj-rules::-webkit-scrollbar{display:none}
.tj-rule{flex:0 0 84%;scroll-snap-align:center;background:var(--paper);border-radius:26px;padding:20px 18px;box-shadow:var(--shadow);border-top:6px solid var(--c)}
.tj-rule h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1}
.tj-rule h3 .tj-ar{font-size:24px;margin-left:8px;color:var(--c)}
.tj-rule .m{font-family:var(--f-lbl);color:var(--ink2);margin:6px 0 10px;font-size:15px}
.tj-rule .lets{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;margin:10px 0 12px}
.tj-rule .lets span{font-family:var(--f-ar);font-size:30px;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg);line-height:1}
.tj-rule .lets span.g{box-shadow:inset 0 0 0 2px var(--tj-g)}
.tj-rule .ex{min-width:0;background:var(--bg);border-radius:16px;padding:8px 10px;text-align:center;font-size:26px;margin-top:8px}
.tj-rule .ex small{display:block;font-family:var(--f-sans);font-size:12px;color:var(--ink2);line-height:1.3}
.tj-dots{display:flex;justify-content:center;gap:6px;margin-top:-6px}
.tj-dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all .3s}
.tj-dots i.on{width:22px;background:var(--ink)}

/* --- Simulateur --- */
.tj-sim{background:var(--night);color:var(--cream);border-radius:28px;padding:18px 14px 16px;box-shadow:0 20px 50px rgba(30,20,14,.35);position:relative;overflow:hidden}
.tj-sim::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--sc,#16A34A) 10%,transparent 25%);opacity:.18;animation:tjSpin 9s linear infinite;z-index:0}
@keyframes tjSpin{to{transform:rotate(360deg)}}
.tj-sim>*{position:relative;z-index:1}
.tj-sim .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tj-sim .top .ttl{font-family:var(--f-lbl);font-size:17px}
.tj-seg{display:flex;background:rgba(247,239,230,.1);border-radius:999px;padding:3px}
.tj-seg button{min-height:34px;padding:0 12px;border-radius:999px;font-size:13px;color:rgba(247,239,230,.7)}
.tj-seg button.on{background:var(--cream);color:var(--night)}
.tj-stage{display:flex;align-items:center;justify-content:center;gap:18px;direction:rtl;height:150px;margin:6px 0 2px}
.tj-stage .base,.tj-stage .next{font-family:var(--f-ar);font-size:64px;line-height:1;position:relative;transition:color .5s,filter .5s,transform .5s,opacity .5s}
.tj-stage .plus{font-size:28px;opacity:.4}
.tj-stage .nn{display:inline-block;transition:color .5s,opacity .5s,filter .5s,transform .5s}
.tj-stage .mini{position:absolute;right:auto;left:50%;top:-24px;font-size:30px;color:var(--tj-g);opacity:0;transform:translate(-50%,-30px)}
.tj-stage.idhar .nn{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.7);animation:fxPulse .8s ease}
.tj-stage.idg .nn{color:var(--tj-s);opacity:.35;transform:scale(.8)}
.tj-stage.idg.gh .next{color:#39E07A;text-shadow:0 0 20px rgba(57,224,122,.7)}
.tj-stage.iqlab .nn{color:var(--tj-s);opacity:.3}
.tj-stage.iqlab .mini{animation:tjDrop .7s cubic-bezier(.3,1.6,.5,1) .2s forwards}
@keyframes tjDrop{to{opacity:1;transform:translate(-50%,0)}}
.tj-stage.ikhfa .nn{color:#39E07A;animation:tjVeil 1.6s ease-in-out infinite}
@keyframes tjVeil{50%{filter:blur(3px);opacity:.55}}
.tj-stage .ring{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:2px solid #39E07A;opacity:0;pointer-events:none}
.tj-stage.gh .ring,.tj-stage.ikhfa .ring,.tj-stage.iqlab .ring{animation:tjRing 1.6s ease-out infinite}
.tj-stage .ring.r2{animation-delay:.8s!important}
@keyframes tjRing{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
.tj-out{min-height:118px;text-align:center}
.tj-out .rn{font-family:var(--f-display);font-size:30px;line-height:1.1}
.tj-out .ra{font-family:var(--f-ar);font-size:20px;opacity:.8}
.tj-out .how{font-size:14px;opacity:.85;margin:4px 0 0}
.tj-out .say{display:inline-block;margin-top:8px;font-size:14px;padding:5px 12px;border-radius:999px;background:rgba(247,239,230,.12)}
.tj-out .hint{opacity:.7;font-size:14px;padding-top:26px}
.tj-out>*{animation:tjUp .5s ease both}
@keyframes tjUp{from{opacity:0;transform:translateY(10px)}}
.tj-keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:rtl;margin-top:10px}
.tj-keys button{font-family:var(--f-ar);font-size:22px;height:44px;border-radius:12px;background:rgba(247,239,230,.08);color:var(--cream);line-height:1;transition:background .3s,transform .15s,box-shadow .3s}
.tj-keys button:active{transform:scale(.9)}
.tj-keys button.grp{box-shadow:inset 0 0 0 2px var(--sc)}
.tj-keys button.cur{background:var(--sc);color:var(--night)}

/* --- Qalqala, ghunna --- */
.tj-qal{display:flex;justify-content:center;gap:10px;direction:rtl;margin:6px 0 10px}
.tj-qal span{font-family:var(--f-ar);font-size:40px;color:var(--tj-q);display:inline-block;animation:fxBounce 1.6s ease infinite}
.tj-qal span:nth-child(2){animation-delay:.12s}.tj-qal span:nth-child(3){animation-delay:.24s}.tj-qal span:nth-child(4){animation-delay:.36s}.tj-qal span:nth-child(5){animation-delay:.48s}
.tj-gh{display:flex;justify-content:center;gap:30px;margin:10px 0}
.tj-gh span{position:relative;font-family:var(--f-ar);font-size:52px;color:var(--tj-g);width:90px;height:90px;display:flex;align-items:center;justify-content:center}
.tj-gh span::before,.tj-gh span::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px solid var(--tj-g);animation:tjRing 2s ease-out infinite}
.tj-gh span::after{animation-delay:1s}

/* --- Lèvres (mîm) --- */
.tj-lips{display:block;margin:0 auto 6px;width:120px;height:60px}
.tj-lips .up{animation:tjLipU 2s ease-in-out infinite;transform-origin:60px 30px}
.tj-lips .lo{animation:tjLipL 2s ease-in-out infinite;transform-origin:60px 30px}
@keyframes tjLipU{50%{transform:translateY(5px)}}
@keyframes tjLipL{50%{transform:translateY(-5px)}}

/* --- Défi --- */
.tj-quiz{background:linear-gradient(160deg,var(--night),#3A2519);color:var(--cream);border-radius:28px;padding:20px 16px;box-shadow:0 20px 50px rgba(30,20,14,.35);position:relative;overflow:hidden;min-height:360px}
.tj-quiz .qh{display:flex;justify-content:space-between;font-size:13px;opacity:.7}
.tj-quiz .qbar{height:4px;border-radius:2px;background:rgba(247,239,230,.12);margin:8px 0 14px;overflow:hidden}
.tj-quiz .qbar span{display:block;height:100%;background:linear-gradient(90deg,var(--tj-g),var(--tj-q));transition:width .5s}
.tj-quiz .qw{text-align:center;font-size:38px;margin:8px 0 4px}
.tj-quiz .qw .k-u{color:var(--cream);text-decoration-color:var(--tj-o)}
.tj-quiz .qq{text-align:center;font-family:var(--f-lbl);font-size:17px;margin:0 0 14px}
.tj-quiz .opts{display:grid;grid-template-columns:1fr;gap:8px;margin:0}
.tj-quiz .opts button{min-height:52px;border-radius:14px;background:rgba(247,239,230,.08);color:var(--cream);font-size:15px;text-align:left;padding:0 16px;transition:background .3s,transform .2s}
.tj-quiz .opts button.ok{background:var(--tj-g);color:#fff;animation:fxPulse .5s}
.tj-quiz .opts button.no{background:var(--accent);color:#fff;animation:tjShake .4s}
@keyframes tjShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tj-quiz .fb{margin-top:12px;font-size:14px;line-height:1.45;background:rgba(247,239,230,.08);border-radius:14px;padding:10px 12px}
.tj-quiz .btn{margin-top:12px}
.tj-quiz .big{font-family:var(--f-display);font-size:72px;text-align:center;line-height:1;margin:14px 0 4px}
.tj-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tj-end{font-family:var(--f-lbl);text-align:center;color:var(--ink2);margin:36px 0 10px;font-size:15px}

@media (prefers-reduced-motion:reduce){.tj *,.tj *::before,.tj *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.tj-rv{opacity:1;transform:none;filter:none}.tj-draw text{stroke-dashoffset:0;fill:rgba(247,239,230,.96)}}

/* =====================================================================
   ACCUEIL (bienvenue) ET RÉVISIONS — animations sobres
   ===================================================================== */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.nav button{font-size:12px}

/* --- Bienvenue --- */
.wel{padding:10px 0 4px;text-align:center}
.wel .lbl{letter-spacing:.14em;text-transform:uppercase;font-size:12.5px}
.wel-ar{display:inline-block;margin:18px 0 0;font-size:clamp(46px,14vw,64px);clip-path:inset(0 0 0 100%);animation:welWipe 1.6s cubic-bezier(.7,0,.2,1) .2s forwards}
.wel-ar .ar{font-size:inherit;line-height:1.7}

/* =====================================================================
   3. DÉCOUPAGE, TRANSCRIPTION, CHRONOLOGIE
   ===================================================================== */
function clusters(str, keepTw) {
  str = String(str || '').normalize('NFC').replace(/[\u200C\u200D]/g, '');
  if (!keepTw) str = str.replace(/\u0640/g, '');
  const out = [];
  for (const ch of str) {
    if (isMark(ch)) { if (!out.length) out.push({ b: '', m: [] }); out[out.length - 1].m.push(ch); }
    else out.push({ b: ch, m: [] });
  }
  out.forEach(c => c.m.sort((x, y) => (x === SH ? -1 : y === SH ? 1 : 0)));
  return out;
}
const cstr = c => c.b + c.m.join('');
const canon = s => clusters(s).map(cstr).join('');
const vowelOf = c => c.m.find(m => VOWELS.includes(m));
const letterCount = s => clusters(s).filter(c => c.b && c.b !== ' ').length;

function sameWord(g, e, ignoreMarks) {
  const G = clusters(g).filter(c => c.b || c.m.length), E = clusters(e).filter(c => c.b || c.m.length);
  if (G.length !== E.length) return false;
  return G.every((c, i) => c.b === E[i].b && (ignoreMarks || c.m.slice().sort().join('') === E[i].m.slice().sort().join('')));
}

/* Transcription phonétique « du cours » : aa / ii / ouu pour les prolongations, an / in / oun pour le tanwin */
function translit(str) {
  const cl = clusters(str); let out = '', pv = '', noDouble = -1;
  for (let i = 0; i < cl.length; i++) {
    const c = cl[i], b = c.b, v = vowelOf(c);
    if (b === ' ') { out += ' '; pv = ''; continue; }
    if (b === '') continue;
    if ((i === 0 || cl[i - 1].b === ' ') && b === 'ا' && cl[i + 1] && cl[i + 1].b === 'ل' && cl[i + 2] && cl[i + 2].b && cl[i + 2].b !== ' ') {
      const n = cl[i + 2];
      if (!cl[i + 1].m.length && n.m.includes(SH)) { out += 'è' + (TR[n.b] || '') + '-'; noDouble = i + 2; }
      else out += 'èl-';
      i = i + 1; pv = ''; continue;
    }
    if (!c.m.length) {
      if (b === 'ا') { if (pv === 'an') { pv = ''; continue; } if (pv === 'a') out = out.replace(/è$/, 'a'); out += 'a'; pv = ''; continue; }
      if (b === 'و' && pv === 'ou') { out += 'u'; pv = ''; continue; }
      if (b === 'ي' && pv === 'i') { out += 'i'; pv = ''; continue; }
      if (b === 'ة') { out += 'a(h)'; pv = ''; continue; }
    }
    let cons = TR[b] ?? '';
    if (HAMZAS.includes(b)) cons = (out === '' || /[ -]$/.test(out)) ? '' : "'";
    if (c.m.includes(SH) && i !== noDouble) cons += cons;
    let snd = v ? VSOUND[v] : '';
    if (HEAVY.includes(b)) snd = snd.replace('è', 'a');
    out += cons + snd;
    pv = v === F ? 'a' : v === K ? 'i' : v === D ? 'ou' : v === FT ? 'an' : '';
  }
  return out;
}

/* Chronologie : séance minimale nécessaire pour lire une chaîne */
function chrono(str) {
  const cl = clusters(str); const need = []; let max = 0;
  const add = (s, label) => { if (s > max) max = s; need.push({ s, label }); };
  /* Article ال en début de chaque mot (aussi dans une petite phrase) */
  const isArt = i => (i === 0 || cl[i - 1].b === ' ') && cl[i] && cl[i].b === 'ا' && cl[i + 1] && cl[i + 1].b === 'ل' && cl[i + 2] && cl[i + 2].b && cl[i + 2].b !== ' ';
  if (cl.some((c, i) => isArt(i))) add(5, 'article ال');
  cl.forEach((c, i) => {
    const b = c.b;
    if (b === '' || b === ' ') { /* rien */ }
    else if (b === 'ا') {
      const p = cl[i - 1];
      if (p && p.m.includes(FT) && !c.m.length) add(1, 'ا après fathatayn');
      else if (!isArt(i)) add(2, 'ا (prolongation)');
      if (c.m.length) add(99, 'ا avec une haraka (hors cours)');
    }
    else if (CHAR_S[b]) add(CHAR_S[b], b);
    else add(99, b + ' (hors cours)');
    c.m.forEach(m => add(MARK_S[m] || 99, (HNAME[m] || 'signe') + (MARK_S[m] ? '' : ' (hors cours)')));
  });
  return { max, need };
}
function chronoIssues(str, s) {
  const seen = {}; return chrono(str).need.filter(x => x.s > s && !seen[x.label] && (seen[x.label] = 1));
}

/* =====================================================================
   4. AFFICHAGE DE L'ARABE : CALQUES COLORÉS + LETTRE EN ROUGE
   Un calque par famille de harakat (bleu / orange / marron) sous un calque
   « lettres + signes neutres ». Tous les calques ont exactement le même texte
   (mêmes lettres, mêmes ZWJ, mêmes chedda), donc la liaison ne casse pas.
   ===================================================================== */
const RJ_ONLY = 'اأإآدذرزوؤةى';
const isArLetter = b => !!b && /[\u0620-\u064A]/.test(b);
const joinsL = b => b === TW || (isArLetter(b) && !RJ_ONLY.includes(b) && b !== 'ء');
const joinsR = b => b === TW || (isArLetter(b) && b !== 'ء');
const famOf = m => FAM.a.includes(m) ? 'a' : FAM.i.includes(m) ? 'i' : FAM.u.includes(m) ? 'u' : null;

function arHTML(str, opt = {}) {
  const cl = clusters(str, true);
  const hl = new Set(opt.hlIdx ? [...opt.hlIdx] : []);
  if (opt.hl) cl.forEach((c, i) => { if (opt.hl.includes(c.b)) hl.add(i); });
  [...hl].forEach(i => {
    if (!cl[i]) return;
    if (cl[i].b === 'ل' && cl[i + 1] && 'اأإآ'.includes(cl[i + 1].b)) hl.add(i + 1);
    if ('اأإآ'.includes(cl[i].b) && cl[i - 1] && cl[i - 1].b === 'ل') hl.add(i - 1);
  });
  const hcls = opt.bad ? 'bad' : 'hl';
  /* Alif qui suit une fathatayn : coloré en bleu comme la fathatayn (son « an ») */
  const clsAt = i => hl.has(i) ? hcls : (cl[i].b === 'ا' && !cl[i].m.length && cl[i - 1] && cl[i - 1].m.includes(FT) ? 'fa' : null);
  /* Chedda + kasra : beaucoup de polices (Noto Naskh, Geeza…) remontent alors la kasra sous la chedda
     et dessinent un glyphe combiné qui ne coïncide plus avec la chedda seule du calque du dessus
     (on voyait « deux chedda »). Dans le calque orange on retire donc la chedda : la kasra se place
     sous la lettre, et la chedda (couleur du texte) reste seule en haut. */
  const marksOf = (c, keep, fam) => c.m.filter(m => keep(m) && !(fam === 'i' && m === SH && c.m.some(x => famOf(x) === 'i'))).join('');
  const build = (keep, fam) => {
    let h = '', i = 0;
    while (i < cl.length) {
      const k0 = clsAt(i);
      if (!k0) { const c = cl[i]; h += esc(c.b + marksOf(c, keep, fam)); i++; continue; }
      let j = i; while (j + 1 < cl.length && clsAt(j + 1) === k0) j++;
      const prev = cl[i - 1], next = cl[j + 1];
      const pre = prev && joinsL(prev.b) && joinsR(cl[i].b) ? ZWJ : '';
      const post = next && joinsL(cl[j].b) && joinsR(next.b) ? ZWJ : '';
      let t = ''; for (let k = i; k <= j; k++) t += cl[k].b + marksOf(cl[k], keep, fam);
      h += pre + '<span class="' + k0 + '">' + pre + esc(t) + post + '</span>' + post;
      i = j + 1;
    }
    return h;
  };
  const all = cl.flatMap(c => c.m);
  let h = '<span class="ar' + (opt.cls ? ' ' + opt.cls : '') + '" dir="rtl" lang="ar" role="img" aria-label="' + esc(canon(str)) + '">';
  ['a', 'i', 'u'].forEach(f => {
    if (all.some(m => famOf(m) === f)) h += '<span class="lay lay-' + f + '" aria-hidden="true">' + build(m => famOf(m) === null || famOf(m) === f, f) + '</span>';
  });
  h += '<span class="lay-top" aria-hidden="true">' + build(m => famOf(m) === null) + '</span></span>';
  return h;
}

function formsFor(card) {

  const c = card.letter;
  switch (card.slug) {
    case 'harakat': add(TW + F, 'fatha', 'fatha : « è »'); add(TW + K, 'kasra', 'kasra : « i »'); add(TW + D, 'damma', 'damma : « ou »'); return out;
    case 'tanwin': add(TW + FT + 'ا', 'fathatayn', 'fathatayn : « èn »'); add(TW + KT, 'kasratayn', 'kasratayn : « in »'); add(TW + DT, 'dammatayn', 'dammatayn : « oun »'); return out;
    case 'soukoun': add('بَسْ', 'ex1'); add('بِنْ', 'ex2'); add('سُنْ', 'ex3'); return out;
    case 'chedda': add('بَبَّ', 'ex1'); add('سِسِّ', 'ex2'); add('نُنُّ', 'ex3'); return out;
    case 'article': add('الْبَابُ', 'ex1', 'èl-baabou (lunaire)'); add('السَّبَبُ', 'ex2', 'ès-sèbèbou (solaire)'); add('الْكَلْبُ', 'ex3', 'èl-kèlbou (lunaire)'); add('الذِّئْبُ', 'ex4', "èdh-dhi'bou (solaire)"); return out;
    case 'alif': add('ا', 'nom', 'alif : prolonge le son'); add('بَا', 'aa'); add('بِي', 'ii'); add('بُو', 'ou'); return out;
    case 'hamza': add('ء', 'nom', 'hamza : on ne prononce que la haraka'); add('أَ', 'fatha'); add('إِ', 'kasra'); add('أُ', 'damma'); return out;
  }
  add(c, 'nom', `${card.name} : ${card.hint}`);
  add(c + F, 'fatha'); add(c + K, 'kasra'); add(c + D, 'damma');
  add(c + FT + (c === 'ة' ? '' : 'ا'), 'fathatayn'); add(c + KT, 'kasratayn'); add(c + DT, 'dammatayn');

  return out;
}

function addWordsV7(c) {
  const mots = c.items.filter(i => i.type === 'mot');
  const have = new Set(mots.map(i => canon(i.arabe)));
  const maxO = {}, audios = new Set(c.items.map(i => i.audio));
  mots.forEach(i => { maxO[i.seance] = Math.max(maxO[i.seance] || 0, Number(i.ordre) || 0); });
  WORDS_V7.forEach(([ar, sens, src]) => {
    if (have.has(canon(ar))) return;
    const s = chrono(ar).max; if (s < 1 || s > 8) return;
    let o = (maxO[s] || 0) + 1; while (audios.has(`S${s}_mot${pad(o)}`)) o++;
    maxO[s] = o; audios.add(`S${s}_mot${pad(o)}`); have.add(canon(ar));
    c.items.push({ id: uid(), type: 'mot', seance: s, ordre: o, arabe: ar, phonetique: translit(ar), source: src || 'reel', audio: `S${s}_mot${pad(o)}`, sens: sens || '', verif: false });
  });
}

  })));
  const cnt = {};

  const c = { version: 7, updatedAt: 0, settings: { phone: '', code: '2026' }, dicteeSettings: {}, items };
  addWordsV7(c);
  return c;
}

/* Mise à jour des anciennes données (v1 → v2) : fatha écrite « è », indices « équivalent du son … ».

function migrate(c) {
  let changed = false;
  if ((c.version || 1) < 2) { migrateV2(c); changed = true; }
  if ((c.version || 1) < 7) { addWordsV7(c); c.version = 7; changed = true; }

}
function migrateV2(c) {
  const oldify = t => String(t).replace(/è/g, 'a');
  const wordPh = Object.fromEntries(WORDS_DEFAULT.map(w => [w[1], w[2]]));
  (c.items || []).forEach(it => {
    let ph = null;
    const card = it.carte && CARDS[it.carte];
    if (it.type === 'lettre' && card) {
      const f = formsFor(card).find(x => x.forme === it.forme && x.ar === it.arabe);
      if (f) {
        ph = f.ph;
        if (it.forme === 'nom' && card.kind === 'lettre' && String(it.phonetique).startsWith(card.name + ' : ') && !/équivalent/.test(it.phonetique)) { it.phonetique = ph; return; }
      }
    } else if (it.type === 'mot' && wordPh[it.arabe]) ph = wordPh[it.arabe];
    if (ph === null) ph = translit(it.arabe);
    if (it.phonetique === oldify(ph) && it.phonetique !== ph) it.phonetique = ph;
  });

}

        r.onupgradeneeded = () => r.result.createObjectStore('a');

      } catch (e) { res(null); }

  },
  all() {
    return new Promise(res => {
      if (!this.db) return res({});
      const out = {};
      try {
        const rq = this.db.transaction('a').objectStore('a').openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
        rq.onerror = () => res(out);
      } catch (e) { res(out); }
    });
  },
  put(k, v) {
    AUDIO_LOC[k] = v;
    return new Promise(res => {
      if (!this.db) return res(false);
      try { const tx = this.db.transaction('a', 'readwrite'); tx.objectStore('a').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); }
    });
  }
};

function analyze(given, expected, opt = {}) {
  const G = clusters(given), E = clusters(expected);
  const n = G.length, m = E.length;
  const d = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
  for (let i = 0; i <= n; i++) d[i][0] = i;
  for (let j = 0; j <= m; j++) d[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (G[i - 1].b === E[j - 1].b ? 0 : 1));
  const pairs = []; let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (G[i - 1].b === E[j - 1].b ? 0 : 1)) { pairs.unshift([i - 1, j - 1]); i--; j--; }
    else if (j > 0 && d[i][j] === d[i][j - 1] + 1) { pairs.unshift([null, j - 1]); j--; }
    else { pairs.unshift([i - 1, null]); i--; }
  }
  const msgs = [], keys = [], dG = new Set(), dE = new Set(), letters = [];
  const say = (msg, key) => { if (!msgs.includes(msg)) msgs.push(msg); if (key && !keys.includes(key)) keys.push(key); };
  const isProlong = (arr, k) => { const c = arr[k], p = arr[k - 1]; return c && !c.m.length && 'اوي'.includes(c.b) && p && vowelOf(p) && LONG[vowelOf(p)] === c.b; };
  const A = s => `<span dir="rtl" lang="ar">${arHTML(s)}</span>`;
  pairs.forEach(([gi, ei]) => {
    const g = gi != null ? G[gi] : null, e = ei != null ? E[ei] : null;
    if (g && e) {
      if (g.b !== e.b) {
        dG.add(gi); dE.add(ei); letters.push(e.b, g.b);
        say(`tu as confondu ${A(g.b)} et ${A(e.b)}`, 'L:' + [g.b, e.b].sort().join('/'));
      }
      if (opt.ignoreMarks) return;
      const gv = vowelOf(g), ev = vowelOf(e);
      if (ev && !gv) { dG.add(gi); dE.add(ei); say(`il manque la ${HNAME[ev]} sur ${A(e.b)}`, 'H:' + HNAME[ev] + '/aucune'); }
      else if (gv && !ev) { dG.add(gi); dE.add(ei); say(`${HNAME[gv]} en trop sur ${A(e.b)}`, 'H:' + HNAME[gv] + '/aucune'); }
      else if (gv && ev && gv !== ev) { dG.add(gi); dE.add(ei); letters.push(e.b); say(`${HNAME[gv]} au lieu de ${HNAME[ev]}`, 'H:' + [HNAME[gv], HNAME[ev]].sort().join('/')); }
      if (e.m.includes(SH) && !g.m.includes(SH)) { dG.add(gi); dE.add(ei); say('il manque la chedda', 'chedda'); }
      if (!e.m.includes(SH) && g.m.includes(SH)) { dG.add(gi); dE.add(ei); say('chedda en trop', 'chedda'); }
      if (e.m.includes(SK) && !g.m.includes(SK)) { dG.add(gi); dE.add(ei); say('il manque le soukoun', 'soukoun'); }
      if (!e.m.includes(SK) && g.m.includes(SK)) { dG.add(gi); dE.add(ei); say('soukoun en trop', 'soukoun'); }
    } else if (e) {
      dE.add(ei);
      if (e.b === ' ') say('il manque un espace entre les mots', 'espace');
      else if (isProlong(E, ei)) say('prolongation oubliée', 'prolongation');
      else if (e.b === 'ا' && E[ei - 1] && E[ei - 1].m.includes(FT)) say('il manque le alif après la fathatayn', 'alif-tanwin');
      else { letters.push(e.b); say(`il manque la lettre ${A(e.b)}`, 'manque:' + e.b); }
    } else if (g) {
      dG.add(gi);
      if (g.b === ' ') say('espace en trop', 'espace');
      else if (isProlong(G, gi)) say('prolongation en trop : ici le son est court', 'prolongation');
      else say(`la lettre ${A(g.b)} est en trop`, 'trop:' + g.b);
    }
  });
  if (!msgs.length) say('regarde bien les deux réponses', null);
  return { msgs, keys, dG, dE, letters: uniq(letters.filter(b => CARD_OF_CH[b])) };
}

function qEmph(l, s) {
  const p = EMPH.find(x => x.includes(l)); if (!p || p.some(x => (CHAR_S[x] || 99) > s)) return null;
  const heavy = Math.random() < .5; const t = heavy ? p[1] : p[0];
  return mcqAr('Emphatique ou pas ?', heavy ? 'Laquelle est la lettre <b>emphatique</b> (son lourd) ?' : 'Laquelle est la lettre <b>légère</b> (non emphatique) ?', t + F, [p[0] + F, p[1] + F],
    { card: CARD_OF_CH[t], note: `${arHTML(p[1])} est emphatique (son lourd), ${arHTML(p[0])} est légère.` });
}
function qSol(l) {
  const sun = SUN.includes(l);
  return { kind: 'mcq', title: 'Solaire ou lunaire ?', prompt: 'Devant cette lettre, l\'article ال est-il solaire ou lunaire ?', display: 'ال' + ' ' + l, displayHTML: `${arHTML('ال')} <span class="muted" style="font-size:28px">+</span> ${arHTML(l)}`,
    options: [{ txt: 'Solaire ☀' }, { txt: 'Lunaire ☾' }], expectedTxt: sun ? 'Solaire ☀' : 'Lunaire ☾', card: 'article', missedLabel: 'ال + ' + l,
    explain: () => ({ msgs: [sun ? `${arHTML(l)} est une lettre solaire : le ل de ال ne se prononce pas et ${arHTML(l)} prend une chedda.` : `${arHTML(l)} est une lettre lunaire : on prononce le ل de ال (« al- »).`], keys: ['sol'], letters: [] }) };
}
function qPos(l, word) {
  const cl = clusters(word).filter(c => c.b && c.b !== ' ');
  if (cl.filter(c => c.b === l).length !== 1) return null;
  const i = cl.findIndex(c => c.b === l); const pos = i === 0 ? 'Début' : i === cl.length - 1 ? 'Fin' : 'Milieu';
  return { kind: 'mcq', title: 'Formes de la lettre', prompt: `Où se trouve ${arHTML(l)} dans ce mot ?`, display: word, displayHTML: arHTML(word), options: ['Début', 'Milieu', 'Fin'].map(txt => ({ txt })), expectedTxt: pos, card: CARD_OF_CH[l], missedLabel: word,
    explain: () => ({ msgs: [`${arHTML(l)} est ${pos === 'Début' ? 'au début' : pos === 'Fin' ? 'à la fin' : 'au milieu'} du mot (on lit de droite à gauche).`], keys: ['pos'], letters: [l] }) };
}
function qTiles(item, s) {
  return { kind: 'tiles', title: 'Reconstitue le mot', prompt: 'Écris ce mot avec les tuiles', ph: item.phonetique || translit(item.arabe), audio: item.audio, expected: item.arabe, s, card: CARD_OF_CH[clusters(item.arabe).map(c => c.b).find(b => CARD_OF_CH[b])] };
}

function stepStrings(st) {
  const a = [];
  if (st.expected) a.push(st.expected);
  if (st.display) a.push(st.display.replace(' ', ''));
  (st.options || []).forEach(o => o.ar && a.push(o.ar));
  if (st.item) a.push(st.item.arabe);
  return a;
}
const validStep = (st, s) => !!st && stepStrings(st).every(x => chronoIssues(x, s).length === 0);

function wordsFor(card, s) {
  const words = C.items.filter(it => it.type === 'mot' && Number(it.seance) === s && okForSession(it)).sort((a, b) => a.ordre - b.ordre);
  if (card.letter) return words.filter(w => clusters(w.arabe).some(c => c.b === card.letter));
  if (card.slug === 'tanwin') return words.filter(w => clusters(w.arabe).some(c => [FT, KT, DT].some(m => c.m.includes(m))));
  if (card.mark) return words.filter(w => clusters(w.arabe).some(c => c.m.includes(card.mark)) || card.slug === 'harakat');
  if (card.slug === 'article') return words.filter(w => canon(w.arabe).startsWith('ال'));
  return words;
}
const formsItems = slug => C.items.filter(it => it.type === 'lettre' && it.carte === slug && okForSession(it)).sort((a, b) => a.ordre - b.ordre);

function cardQuiz(card, s) {
  const q = [], L = card.letter, P = pool(s);
  const rep = (n, f) => { for (let i = 0; i < n; i++) q.push(f()); };
  switch (card.slug) {
    case 'harakat': rep(4, () => qHaraka(pick(P), false)); break;
    case 'tanwin': rep(3, () => qHaraka(pick(P), true)); q.push(qHaraka(pick(P), false)); break;
    case 'alif': rep(4, () => qProlong(pick(P))); break;
    case 'soukoun': rep(3, () => qSukun(s)); break;
    case 'chedda': rep(3, () => qShadda(pick(P))); break;
    case 'article': shuffle(LETTERS.filter(l => l.s <= s && !'اءة'.includes(l.ch))).slice(0, 5).forEach(l => q.push(qSol(l.ch))); break;
    case 'hamza': rep(3, qHamza); break;
    default:
      rep(2, () => qHaraka(L, false));
      q.push(qHaraka(L, true));
      if (s >= 2 && L !== 'ة') q.push(qProlong(L));
      if (s >= 3 && L !== 'ة') q.push(qShadda(L));
      q.push(qDiscrim(L, s));
      q.push(qEmph(L, s));
      if (s >= 5 && L !== 'ة') q.push(qSol(L));
  }
  /* Petites phrases (2 mots) : lues en carte, mais pas en tuiles ni en « début / milieu / fin » */
  const words = wordsFor(card, s).filter(w => !/\s/.test(String(w.arabe).trim()));
  if (L) { const w = shuffle(words).map(x => qPos(L, x.arabe)).find(Boolean); if (w) q.push(w); }
  let tw = shuffle(words).slice(0, 2);
  if (!tw.length) tw = shuffle(formsItems(card.slug).filter(f => f.forme !== 'nom' && letterCount(f.arabe) >= 2)).slice(0, 1);
  tw.forEach(w => q.push(qTiles(w, s)));
  return q.filter(st => validStep(st, s));
}

function buildMini(key, s) {
  const qs = [], P = pool(s), n = 4;
  if (key.startsWith('L:')) {
    const [a, b] = key.slice(2).split('/');
    if (!P.includes(a) || !P.includes(b)) return [];
    for (let i = 0; i < n; i++) { const h = pick([F, K, D]); const t = pick([a, b]) + h; qs.push(mcqAr('Entraînement ciblé', `Laquelle se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, [a + h, b + h])); }
  } else if (key.startsWith('H:')) {
    const [x, y] = key.slice(2).split('/').map(v => NAME2MARK[v]);
    if (!x || !y) return [];
    for (let i = 0; i < n; i++) { const l = pick(P); const o = [withTanwinAlif(l, x), withTanwinAlif(l, y)]; const t = pick(o); qs.push(mcqAr('Entraînement ciblé', `Laquelle se lit <b>« ${esc(phonOf(t))} »</b> ?`, t, o)); }
  } else if (key === 'chedda' && s >= 3) { for (let i = 0; i < n; i++) qs.push(qShadda(pick(P))); }
  else if (key === 'soukoun' && s >= 3) { for (let i = 0; i < n; i++) qs.push(qSukun(s)); }
  else if (key === 'prolongation' && s >= 2) { for (let i = 0; i < n; i++) qs.push(qProlong(pick(P))); }
  else if (key === 'sol' && s >= 5) { shuffle(LETTERS.filter(l => l.s <= s && !'اءة'.includes(l.ch))).slice(0, n).forEach(l => qs.push(qSol(l.ch))); }
  return qs.filter(st => validStep(st, s)).map(st => Object.assign(st, { mini: true }));
}

/* =====================================================================
   13. SÉRIES D'EXERCICES
   ===================================================================== */
let S = null, KB = null, fbTimer = null;

function openCard(slug) {
  const card = CARDS[slug], s = card.s;
  const steps = [{ kind: card.kind === 'notion' || slug === 'alif' ? 'notion' : 'formes', card }];
  formsItems(slug).forEach(it => steps.push({ kind: 'flash', item: it, card }));
  shuffle(wordsFor(card, s)).slice(0, 6).forEach(it => steps.push({ kind: 'flash', item: it, card }));
  steps.push(...shuffle(cardQuiz(card, s)));
  startSeries({ kind: 'serie', slug, s, title: `Série ${card.letter || card.name} (séance ${s})`, label: `Séance ${pad(s)}`, steps });
}
function openRevision(s) {
  const words = C.items.filter(it => it.type === 'mot' && Number(it.seance) === s && okForSession(it));
  const quiz = shuffle(sessionCards(s).flatMap(c => cardQuiz(c, s))).slice(0, 10);
  const steps = [...shuffle(words).slice(0, 6).map(it => ({ kind: 'flash', item: it })), ...quiz];
  startSeries({ kind: 'revision', s, title: `Révision séance ${s}`, label: `Séance ${pad(s)}`, steps });
}
function startSeries(o) {
  clearTimeout(fbTimer);
  S = Object.assign({ i: 0, ok: 0, total: 0, missed: [], conf: {}, miniDone: {}, flashOk: 0, flashRev: 0, pendingMini: null, trk: {} }, o);
  show('series'); renderStep();
}

function seriesTop() {
  const n = S.steps.length, i = Math.min(S.i, n);
  return `<div class="s-top"><button class="x" data-act="quit" aria-label="Quitter la série">${ICON.x}</button>
    <div class="bar" aria-hidden="true"><span style="width:${Math.round(i / n * 100)}%"></span></div><span class="s-count">${i < n ? i + 1 : n}/${n}</span></div>`;
}

function renderStep() {
  clearTimeout(fbTimer);
  const st = S.steps[S.i];
  if (!st) return renderResult();
  let h = seriesTop();
  const R = { formes: stepFormes, notion: stepNotion, flash: stepFlash, mcq: stepMcq, tiles: stepTiles, dictee: stepTiles, 'mini-intro': stepMiniIntro, ex: stepEx }[st.kind];
  h += R(st);
  main().innerHTML = h;
  if (st.kind === 'tiles' || st.kind === 'dictee') { KB = { tokens: [], s: st.s || S.s }; renderAns(); }
  if (st.kind === 'ex' && st.type === 'ecris') initDraw(st);
  window.scrollTo(0, 0);
}
function next() { S.i++; renderStep(); }

/* ---- a) écran « formes de la lettre » ---- */
function stepFormes(st) {
  const c = st.card, l = c.letter, nom = formsItems(c.slug).find(f => f.forme === 'nom');
  const rj = RJ_ONLY.includes(l) || l === 'ء';
  const f3 = l === 'ة'
    ? [['Seule', l], ['Fin de mot', TW + l], ['Fin de mot', 'بَ' + l]]
    : l === 'ء' ? [['Seule', 'ء'], ['Sur alif', 'أ'], ['Sous alif', 'إ']]
      : [['Début de mot', rj ? l : l + TW], ['Milieu de mot', rj ? TW + l : TW + l + TW], ['Fin de mot', TW + l]];
  return `<p class="step-lbl">${esc(S.label)}</p><h2 class="step-title">La lettre ${esc(c.name)}</h2><hr class="rule">
    <div class="center big"><span class="onl">${arHTML(l)}</span></div>
    <p class="center phon">${esc(c.name)}</p><p class="center sens">${esc(c.hint)}</p>
    <div class="center">${nom ? audioBtn(nom.audio) : ''}</div>
    <div class="forms3">${f3.map(([t, a]) => `<div class="fcard"><p class="lbl">${t}</p>${arHTML(a, { hl: [l, 'أ', 'إ'] })}</div>`).join('')}</div>
    ${rj && l !== 'ة' && l !== 'ء' ? `<p class="note">${arHTML(l)} ne s'attache jamais à la lettre qui suit (à sa gauche).</p>` : ''}
    ${l === 'ء' ? '<p class="note">La hamza se pose souvent sur un support : alif (أ إ), waw (ؤ) ou ya (ئ). On ne prononce que sa haraka.</p>' : ''}
    <button class="btn primary block" data-act="next">Commencer</button>`;
}
/* ---- notion (harakat, tanwin, prolongations…) ---- */
const NOTION_TXT = {
  harakat: 'Les harakat sont les petites voyelles posées sur ou sous la lettre. Fatha (petit trait au-dessus) = « è », kasra (petit trait en dessous) = « i », damma (petit waw au-dessus) = « ou ».',
  tanwin: 'Le tanwin double la haraka et ajoute un son « n » à la fin du mot : « èn », « in », « oun ». La fathatayn s\'écrit toujours avec un alif (tous deux en bleu).',
  alif: 'La prolongation allonge le son de la haraka : fatha + ا = « aa », kasra + ي = « ii », damma + و = « ouu ». La lettre de prolongation ne porte pas de haraka.',
  soukoun: 'Le soukoun (petit rond) indique que la lettre n\'a pas de voyelle : on la prononce collée à la syllabe d\'avant.',
  chedda: 'La chedda double la lettre : on la prononce deux fois (une fois à la fin de la syllabe d\'avant, une fois avec sa haraka).',
  article: 'L\'article ال veut dire « le, la ». Devant une lettre lunaire, on prononce « èl- » (le ل porte un soukoun). Devant une lettre solaire, le ل ne se prononce pas et la lettre qui suit porte une chedda.'
};
function stepNotion(st) {

    <div class="examples">${ex.filter(f => f.forme !== 'nom').map(f => `<div class="ex">${arHTML(f.arabe)}<small>${esc(f.phonetique)}</small></div>`).join('')}</div>
    <button class="btn primary block" data-act="next">Commencer</button>`;
}
/* ---- b) carte recto / verso ---- */
function stepFlash(st) {

  return `<p class="step-lbl">${esc(S.label)}</p><h2 class="step-title">${isWord ? 'Carte mot' : 'Carte lettre'}${st.retry ? ' — on revoit' : ''}</h2>
    <div class="flip" id="flip"><div class="flip-in" data-act="flip" role="button" aria-label="Retourner la carte" tabindex="0">
      <div class="face front"><span class="tag">${isWord ? (/\s/.test(String(it.arabe).trim()) ? 'Lis ces mots' : 'Lis ce mot') : 'Lis cette syllabe'}</span>${it.source === 'invente' ? '<span class="tag-r badge inv">lecture syllabique</span>' : ''}
        <div class="${isWord ? 'word' : 'big'}">${isWord ? arHTML(it.arabe, { hl: hlL }) : `<span class="onl">${arHTML(it.arabe)}</span>`}</div><span class="hint">Touche la carte pour la retourner</span></div>
      <div class="face back"><span class="tag">Correspondance en français</span>
        <p class="phon">${esc(it.phonetique || translit(it.arabe))}</p>${it.sens ? `<p class="sens">${esc(it.sens)}</p>` : ''}

        ${audioBtn(it.audio)}</div>
    </div></div>

/* ---- QCM ---- */
function stepMcq(st) {
  return `<p class="step-lbl">${esc(S.label)}${st.retry ? ' — on reprend' : ''}${st.mini ? ' — entraînement ciblé' : ''}</p><h2 class="step-title">${esc(st.title)}</h2><hr class="rule">

    <div class="opts">${st.options.map((o, i) => `<button class="opt${o.txt ? ' txt' : ''}" data-act="opt" data-i="${i}">${o.txt ? esc(o.txt) : arHTML(o.ar)}</button>`).join('')}</div>

/* ---- tuiles (reconstitution et dictée) ---- */
function tilesHTML(s) {
  const sg = SIGN_TILES.filter(t => t[1] <= s).map(([t]) => `<button class="tile sign" data-act="tile" data-t="${t}" aria-label="${HNAME[t]}">${arHTML(TW + t)}</button>`).join('');

function stepTiles(st) {

  if (dict) head = `<h2 class="step-title">Mot ${st.num}${st.retry ? ' (reprise)' : ''}</h2><hr class="rule">
      <div class="center" style="margin:6px 0 4px">${hasA ? audioBtn(st.audio, 'Écouter le mot', true) : `<p class="note">Audio pas encore disponible : lis la correspondance en français <b>« ${esc(st.ph)} »</b></p>`}</div>
      <p class="center small muted">${st.ignoreMarks ? 'Les harakat ne sont pas obligatoires pour cette dictée.' : 'N\'oublie pas les harakat.'} Tu peux réécouter autant que tu veux.</p>`;
  else head = `<h2 class="step-title">${esc(st.title)}${st.retry ? ' — on reprend' : ''}</h2><hr class="rule">
      <p class="prompt">${st.prompt} : <b>« ${esc(st.ph)} »</b></p>${hasA ? `<div class="center">${audioBtn(st.audio)}</div>` : ''}`;

    <div class="ans" id="ans" aria-live="polite"></div>

function renderAns() {
  const a = $('#ans'); if (!a) return;
  a.innerHTML = KB.tokens.length ? arHTML(KB.tokens.join('')) : '<span class="ph">Touche les tuiles pour écrire</span>';
}
function addTile(t) {
  if (!KB) return;
  if (isMark(t)) {
    const cl = clusters(KB.tokens.join('')); const last = cl[cl.length - 1];
    if (!last || !last.b || last.b === ' ') return toast('Commence par une lettre, puis ajoute la haraka');
    const hasV = !!vowelOf(last);
    if (VOWELS.includes(t) && (hasV || last.m.includes(SK))) return toast('Une lettre ne porte qu\'une seule haraka');
    if (t === SK && (hasV || last.m.includes(SK) || last.m.includes(SH))) return toast('Le soukoun ne va pas avec une autre haraka');
    if (t === SH && (last.m.includes(SH) || last.m.includes(SK))) return toast('Cette lettre a déjà un signe');
  }
  KB.tokens.push(t); renderAns();
}

/* ---- intro de l'entraînement ciblé ---- */
function stepMiniIntro(st) {
  return `<div class="mini-intro"><p class="lbl">Petit entraînement ciblé</p><p class="prompt">Tu as confondu deux fois <b>${confLabelHTML(st.key)}</b>. On s'entraîne sur ${st.count} questions, puis on reprend la série.</p>
    <button class="btn primary block" data-act="next">C'est parti</button></div>`;
}
const confLabelHTML = k => k.startsWith('L:') ? k.slice(2).split('/').map(x => arHTML(x)).join(' / ') : esc(confLabel(k));

/* ---- réponse ---- */
function answer(st, given, correct) {
  const first = !st.retry && !st.mini;
  if (first) { S.total++; if (correct) S.ok++; }
  $$('.opt,.tile,#valrow button,.kb-ctrl button').forEach(b => b.disabled = true);
  const fb = $('#fb');
  if (correct) {
    trackStep(st, given, true);
    fb.innerHTML = `<div class="fb-ok">${ICON.check}<span>${pick(['Bravo !', 'C\'est juste !', 'Très bien !', 'Parfait !'])}</span></div>`;
    fbTimer = setTimeout(next, 900);
    return;
  }
  const an = st.explain ? st.explain(given) : analyze(given, st.expected, { ignoreMarks: st.ignoreMarks });
  trackStep(st, given, false, an);
  if (first) S.missed.push(st.missedLabel || st.expected);
  if (!st.mini) {
    an.keys.forEach(k => {
      S.conf[k] = (S.conf[k] || 0) + 1;
      if (S.conf[k] === 2 && !S.miniDone[k] && !S.pendingMini) {
        const qs = buildMini(k, S.s); S.miniDone[k] = 1;
        if (qs.length) S.pendingMini = { key: k, qs };
      }
    });
    st.tries = (st.tries || 0) + 1;
    if (st.tries <= 2) {
      const clone = Object.assign({}, st, { retry: true, tries: st.tries });
      if (clone.options) clone.options = shuffle(clone.options);
      S.steps.splice(Math.min(S.i + 3, S.steps.length), 0, clone);
    }
  }
  fb.innerHTML = remedHTML(st, given, an);
  fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function remedHTML(st, given, an) {
  let cmp;
  if (st.expectedTxt) cmp = `<div><p class="lbl">Ta réponse</p><p class="txtans">${esc(given)}</p></div><div class="good"><p class="lbl">Bonne réponse</p><p class="txtans">${esc(st.expectedTxt)}</p></div>`;
  else {
    const strip = (str, diff) => `<div class="strip">${clusters(str).map((c, i) => c.b === ' ' ? '<span class="sp"></span>' : `<span class="cl${diff.has(i) ? ' bad' : ''}">${arHTML(cstr(c))}</span>`).join('')}</div>`;
    cmp = `<div><p class="lbl">Ta réponse</p>${given ? arHTML(given, { hlIdx: an.dG, bad: true }) : '<p class="txtans">—</p>'}${given ? strip(given, an.dG) : ''}</div>
      <div class="good"><p class="lbl">Bonne réponse</p>${arHTML(st.expected, { hlIdx: an.dE, bad: true })}${strip(st.expected, an.dE)}</div>`;
  }
  const cards = uniq([...(an.letters || []).map(b => CARD_OF_CH[b]), st.card].filter(Boolean)).slice(0, 2);
  const aud = st.audio && audioURL(st.audio) ? `<button class="btn soft" data-play="${esc(st.audio)}">${ICON.play} Réécouter</button>` : '';
  return `<div class="remed" role="alert"><h3>Pas tout à fait. Regardons ensemble.</h3>
    <div class="cmp">${cmp}</div>
    <ul class="msgs">${an.msgs.map(m => `<li>${m.charAt(0).toUpperCase() + m.slice(1)}.</li>`).join('')}${st.note ? `<li>${st.note}</li>` : ''}</ul>
    <div class="remed-actions">${aud}${cards.map(sl => `<button class="btn soft" data-act="see-card" data-slug="${sl}">Revoir ${CARDS[sl].letter ? arHTML(CARDS[sl].letter) : esc(CARDS[sl].name)}</button>`).join('')}</div>
    <p class="small muted">${st.mini ? '' : 'Pas de souci : cette question reviendra un peu plus loin.'}</p>
    <button class="btn primary block" data-act="continue">Continuer</button></div>`;
}
function continueAfterError() {
  if (S.pendingMini) {
    const { key, qs } = S.pendingMini; S.pendingMini = null;
    S.steps.splice(S.i + 1, 0, { kind: 'mini-intro', key, count: qs.length }, ...qs);
  }
  next();
}

/* ---- aperçu d'une carte (remédiation) ---- */
function showCardModal(slug) {
  const c = CARDS[slug], forms = formsItems(slug);
  modal(`<h2>${c.letter ? 'La lettre ' : ''}${esc(c.name)}</h2><p class="lbl">${esc(c.hint)} — séance ${c.s}</p><hr class="rule">

    <div class="examples">${forms.map(f => `<div class="ex">${arHTML(f.arabe)}<small>${esc(f.phonetique)}</small>${audioURL(f.audio) ? `<div><button class="link" data-play="${esc(f.audio)}">écouter</button></div>` : ''}</div>`).join('')}</div>
    <button class="btn primary block" data-act="close-modal">Revenir à l'exercice</button>`);
}

/* ---- fin de série ---- */
function renderResult() {
  const score = `${S.ok}/${S.total}`, date = today();
  const confKeys = Object.keys(S.conf).filter(k => !k.includes('aucune') || true);
  const better = (old) => !old || !old.best || (S.total && (S.ok / S.total) >= (old.bestRatio || 0));
  if (S.kind === 'serie') { const o = P.cards[S.slug] || {}; P.cards[S.slug] = Object.assign(o, { done: 1, last: score, date }, better(o) ? { best: score, bestRatio: S.total ? S.ok / S.total : 1 } : {}); }
  if (S.kind === 'revision') { const o = P.revisions[S.s] || {}; P.revisions[S.s] = Object.assign(o, { last: score, date }, better(o) ? { best: score, bestRatio: S.total ? S.ok / S.total : 1 } : {}); }
  if (S.kind === 'dictee') { const o = P.dictees[S.did] || {}; P.dictees[S.did] = Object.assign(o, { last: score, date, s: S.s, num: S.num }, better(o) ? { best: score, bestRatio: S.total ? S.ok / S.total : 1 } : {}); }
  saveP();
  const missed = uniq(S.missed);
  const pct = S.total ? S.ok / S.total : 1;
  const msg = pct === 1 ? 'Sans faute, bravo !' : pct >= .7 ? 'Très bon travail !' : 'Beau travail : chaque erreur t\'a fait progresser.';
  main().innerHTML = `${seriesTop()}<div class="result">
    <p class="step-lbl">${esc(S.label)}</p><h2 class="step-title">${esc(S.title)}</h2><hr class="rule">
    ${S.total ? `<p class="score">${S.ok}<small>/${S.total}</small></p>` : ''}
    <p class="prompt">${msg}</p>
    ${bilanHTML()}
    ${S.flashOk + S.flashRev ? `<p class="muted small">Cartes : ${S.flashOk} « je savais », ${S.flashRev} « à revoir »</p>` : ''}
    ${missed.length ? `<p class="lbl">${S.kind === 'dictee' ? 'Mots à retravailler' : 'À retravailler'}</p><div class="chips">${missed.map(m => `<span class="chip">${/[\u0600-\u06FF]/.test(m) ? arHTML(m) : esc(m)}</span>`).join('')}</div>` : ''}
    ${confKeys.length ? `<p class="lbl">Confusions</p><div class="chips">${confKeys.map(k => `<span class="chip">${confLabelHTML(k)}</span>`).join('')}</div>` : ''}
    <div class="stack" style="margin-top:18px">

function progressMessage() {
  let t = `${ELEVE.prenom || 'Élève'} – Ma progression – ${today()}`;
  for (let s = 1; s <= 8; s++) {
    const cards = sessionCards(s), done = cards.filter(c => cardDone(c.slug));
    const parts = [`${done.length}/${cards.length} cartes`];
    done.forEach(c => parts.push(`${c.letter || c.name} ${P.cards[c.slug].best || ''}`.trim()));
    if (P.revisions[s]) parts.push(`révision ${P.revisions[s].best}`);
    Object.values(P.dictees).filter(d => d.s === s).forEach(d => parts.push(`dictée n°${d.num} ${d.best}`));

/* Envoi WhatsApp : lien wa.me (seule méthode qui garde le message pré-rempli sur iPhone et Android).
   La page de l'app reste ouverte derrière. */
const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function sendWhatsApp(text) {
  const num = String(C.settings.phone || '').replace(/\D/g, '');
  if (!num) toast('Numéro du prof pas encore réglé : choisis le contact dans WhatsApp');
  const t = encodeURIComponent(text);
  const web = 'https://wa.me/' + num + '?text=' + t;
  if (!isMobile()) { window.open(web, '_blank', 'noopener'); return; }
  let left = false;
  const onHide = () => { if (document.hidden) left = true; };
  document.addEventListener('visibilitychange', onHide);
  window.addEventListener('pagehide', onHide);
  const a = document.createElement('a');
  a.href = web; a.target = '_blank';
  a.rel = 'noopener'; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', onHide);
    if (!left && !document.hidden) modal(`<h2>Envoi vers WhatsApp</h2><hr class="rule">
      <p>Ton message est prêt. Si WhatsApp ne s'est pas ouvert, touche le bouton ci-dessous.</p>
      <a class="btn primary block" href="${esc(web)}" target="_blank" rel="noopener">Ouvrir WhatsApp</a>
      <button class="btn ghost block" data-act="close-modal" style="margin-top:10px">Fermer</button>`);
  }, 2500);
}

function dicteesOf(s) {

function openDictee(id) {
  const [s, d] = id.split('_').map(Number);

  const steps = words.map((w, i) => ({ kind: 'dictee', item: w, num: i + 1, s, expected: w.arabe, audio: w.audio, ph: w.phonetique || translit(w.arabe), ignoreMarks: ign, card: CARD_OF_CH[clusters(w.arabe).map(c => c.b).find(b => CARD_OF_CH[b])] }));
  startSeries({ kind: 'dictee', s, num: d, did: id, title: `Dictée séance ${s} n°${d}`, label: `Dictée séance ${s} n°${d}`, steps });
